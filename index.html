/** Odebere osobu a posune uložené barvy dalších osob (cesty osoby.N.* se přečíslují). */
function tkRemovePerson(t, n) {
  t.osoby.splice(n, 1);
  const out = {};
  Object.entries(t.barvy || {}).forEach(([k, v]) => {
    const m = k.match(/^osoby\.(\d+)\.(.*)$/);
    if (!m) { out[k] = v; return; }
    const i = +m[1];
    if (i < n) out[k] = v; else if (i > n) out[`osoby.${i - 1}.${m[2]}`] = v;
  });
  t.barvy = out;
}
/* Výběr barvy: jeden plovoucí panel, ukáže se nad políčkem při kliknutí do něj, zmizí po opuštění.
   Kliknutí na kolečko nebere políčku fokus (mousedown preventDefault). Klávesnice: Alt+1 / 2 / 3. */
let tkPickEl = null, tkPickFor = null;
function tkWireColors(scroll, t) {
  if (!tkPickEl) {
    tkPickEl = document.createElement('div');
    tkPickEl.className = 'tk-pick-col'; tkPickEl.hidden = true;
    tkPickEl.setAttribute('role', 'group'); tkPickEl.setAttribute('aria-label', 'Barva textu');
    tkPickEl.innerHTML = TK_COLORS.map((c, i) => `<button type="button" tabindex="-1" data-col="${c.hex}" style="background:${c.hex}" aria-label="${c.name} (Alt+${i + 1})" title="${c.name} (Alt+${i + 1})"></button>`).join('');
    document.body.appendChild(tkPickEl);
    tkPickEl.addEventListener('mousedown', e => e.preventDefault());
    tkPickEl.addEventListener('click', e => { const b = e.target.closest('[data-col]'); if (b && tkPickFor) tkApplyColor(tkPickFor, b.dataset.col); });
    window.addEventListener('hashchange', tkHidePick);
    window.addEventListener('resize', tkPlacePick);
    document.getElementById('view').addEventListener('scroll', tkPlacePick, { passive: true });
  }
  tkPickEl._t = t;
  scroll.addEventListener('focusin', e => {
    const el = e.target.closest('[data-f]');
    if (!el || !tkColorable(el.dataset.f)) { tkHidePick(); return; }
    tkPickFor = el; tkMarkPick(); tkPickEl.hidden = false; tkPlacePick();
  });
  scroll.addEventListener('focusout', e => { if (!e.relatedTarget || !tkPickEl.contains(e.relatedTarget)) tkHidePick(); });
  scroll.addEventListener('scroll', tkPlacePick, { passive: true });
  scroll.addEventListener('keydown', e => {
    if (!e.altKey || !tkPickFor || !/^[123]$/.test(e.key)) return;
    e.preventDefault(); tkApplyColor(tkPickFor, TK_COLORS[+e.key - 1].hex);
  });
}
function tkHidePick() { if (tkPickEl) tkPickEl.hidden = true; tkPickFor = null; }
function tkMarkPick() {
  if (!tkPickFor) return;
  const path = tkPickFor.dataset.f, cur = tkColorOf(tkPickEl._t, path) || tkDefColor(path);
  tkPickEl.querySelectorAll('[data-col]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.col === cur)));
}
function tkPlacePick() {
  if (!tkPickEl || tkPickEl.hidden || !tkPickFor || !tkPickFor.isConnected) return;
  const r = tkPickFor.getBoundingClientRect(), pw = tkPickEl.offsetWidth, ph = tkPickEl.offsetHeight;
  let top = r.top - ph - 6; if (top < 8) top = r.bottom + 6;                 // nad políčkem, u horního okraje pod ním
  const left = Math.min(Math.max(8, r.left + r.width / 2 - pw / 2), window.innerWidth - pw - 8);
  tkPickEl.style.top = top + 'px'; tkPickEl.style.left = left + 'px';
}
function tkApplyColor(el, hex) {
  const t = tkPickEl._t, path = el.dataset.f;
  if (!t.barvy) t.barvy = {};
  if (hex === tkDefColor(path)) { delete t.barvy[path]; el.style.color = ''; } else { t.barvy[path] = hex; el.style.color = hex; }
  tkMarkPick(); tkDirty();
}
/** Změna → průběžné uložení (po 0,8 s nečinnosti); tlačítko Uložit uloží hned. */
function tkDirty(now) {
  const st = $('#tkState'); if (st) st.textContent = 'Neuložené změny…';

function tkFlush(force) {

/* ---------- písmo DejaVu Sans (podobné Verdaně z předlohy), vložené kvůli češtině v PDF ---------- */
let sansLoaded = false;
function ensureSansFont() {
  if (sansLoaded || !window.FontFace || !document.fonts) return;
  sansLoaded = true;
  [[TK_SANS_R, '400', 'normal'], [TK_SANS_B, '700', 'normal'], [TK_SANS_BI, '700', 'italic'], [TK_SANS_I, '400', 'italic']].forEach(([b64, weight, style]) => {
    try { const f = new FontFace('BP Sans', `url(data:font/ttf;base64,${b64})`, { weight, style }); document.fonts.add(f); f.load().catch(() => {}); } catch (e) { /* zůstane Verdana */ }

/* ---------- tisk: jen list, A4 na šířku ---------- */
function printTabulka(t) {
  let sheet = $('#printSheet');
  if (!sheet) { sheet = document.createElement('div'); sheet.id = 'printSheet'; document.body.appendChild(sheet); }
  const pages = tkPages(t.osoby.length);
  sheet.innerHTML = pages.map(([a, b], i) => `<div class="tk-page">${tkSheetHTML(t, 'view', a, b, i === pages.length - 1)}</div>`).join('');
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); sheet.innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  let framed = true; try { framed = window.self !== window.top; } catch (e) { /* cizí rámec */ }
  try { window.print(); } catch (e) { /* blokováno */ }
  if (framed) { setTimeout(done, 1500); infoToast('Pokud se tiskový dialog neotevřel (online náhled tisk blokuje), použijte Stáhnout jako PDF.'); }
}

/* ---------- PDF: list nakreslený v jsPDF podle stejné geometrie (A4 na šířku, okraje 15 mm) ---------- */
async function tabulkaPDF(t) {
  const { jsPDF } = await loadJsPDF();
  const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'landscape' });
  [['R', 'normal', TK_SANS_R], ['B', 'bold', TK_SANS_B], ['BI', 'bolditalic', TK_SANS_BI], ['I', 'italic', TK_SANS_I]]
    .forEach(([n, style, b64]) => { doc.addFileToVFS(`BPSans-${n}.ttf`, b64); doc.addFont(`BPSans-${n}.ttf`, 'BPSans', style); });
  doc.addFileToVFS('BPSerif-Regular.ttf', FONT_REG_B64); doc.addFont('BPSerif-Regular.ttf', 'BPSerif', 'normal');
  doc.setProperties({ title: 'Tabulka klienta', creator: 'Benefit Planner' });
  const M = 15, S = 267 / 1597;                          // mm na „px fotky“
  const X = px => M + px * S, W = px => px * S, PT = px => px * S / 0.3528;
  const colX = [0]; TK_COLS.forEach((w, i) => colX.push(colX[i] + w));
  const GREEN = [3, 163, 57], GREEN_T = [6, 162, 63], LINE = [112, 112, 112], GREY = [242, 242, 242], GRP = [214, 236, 213];
  const fill = (rgb, x, y, w, h) => { doc.setFillColor(...rgb); doc.rect(X(x), y, W(w), h, 'F'); };
  const line = (x1, y1, x2, y2, rgb = LINE, lw = 0.2, dash) => { doc.setDrawColor(...rgb); doc.setLineWidth(lw); doc.setLineDashPattern(dash || [], 0); doc.line(x1, y1, x2, y2); doc.setLineDashPattern([], 0); };
  /** Text do rámečku (px fotky): zarovnání, zmenšení písma, když se nevejde. */
  const txt = (s, x, y, w, h, o = {}) => {
    s = String(s ?? '').replace(/[\u00a0\u202f]/g, ' '); if (!s) return;   // nezlomitelné mezery z toLocaleString → běžné
    doc.setFont('BPSans', o.style || 'bold'); doc.setTextColor(...(o.color || [34, 34, 34]));
    let size = PT(o.size || 14);
    doc.setFontSize(size);
    while (size > 4 && doc.getTextWidth(s) > W(w) - 1) { size -= 0.25; doc.setFontSize(size); }
    const tw = doc.getTextWidth(s), al = o.align || 'center';
    const tx = al === 'left' ? X(x) + W(o.pad ?? 4) : al === 'right' ? X(x + w) - W(o.pad ?? 4) - tw : X(x) + (W(w) - tw) / 2;
    const ty = y + h / 2 + size * 0.3528 * 0.35;
    doc.text(s, tx, ty);
    if (o.underline) line(tx, ty + 0.5, tx + tw, ty + 0.5, o.color, 0.15);
  };
  const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const C = (path, def) => { const h = tkColorOf(t, path); return h ? hexRgb(h) : def; };
  const H = { grp: 26 * S, h1: 23 * S, h2: 15 * S, a: 84 * S, b: 65 * S, c: 15 * S, gap: 5 * S, foot: 230 * S };

  const header = y0 => {
    doc.addImage(TK_BANNER, 'JPEG', X(0), y0, W(1596), W(78)); let y = y0 + W(78);
    fill(GRP, colX[2], y, colX[5] - colX[2], H.grp); fill(GRP, colX[9], y, colX[12] - colX[9], H.grp);
    [[TK_IC_ROD, 2, 5, 'Zajištění rodiny', 40], [TK_IC_STD, 5, 9, 'Zajištění životního standardu', 26], [TK_IC_PRI, 9, 12, 'Zajištění příjmů', 28]].forEach(([img, a, b, s, iw]) => {
      doc.setFont('BPSans', 'bold'); doc.setFontSize(PT(11.5)); const tw = doc.getTextWidth(s);
      const total = W(iw) + W(28) + tw, x0 = X(colX[a]) + (W(colX[b] - colX[a]) - total) / 2;
      const ih = W(20); doc.addImage(img, 'JPEG', x0, y + (H.grp - ih) / 2, W(iw), ih);
      doc.setTextColor(...GREEN_T); doc.text(s, x0 + W(iw) + W(28), y + H.grp / 2 + PT(11.5) * 0.3528 * 0.35);
    });
    y += H.grp;
    const yb = y + H.h1 + H.h2;
    line(X(0), y, X(1596), y); line(X(0), yb, X(1596), yb);
    line(X(colX[2]), y + H.h1, X(colX[5]), y + H.h1); line(X(colX[6]), y + H.h1, X(colX[8]), y + H.h1);
    colX.forEach((cx, i) => {
      const sub = [3, 4, 7].includes(i);
      line(X(cx), sub ? y + H.h1 : y, X(cx), yb);
    });
    const big = [[0, 'KLIENT'], [1, 'PRODUKT'], [5, 'VÁŽNÉ CHOROBY'], [8, ['TRVALÉ NÁSLEDKY', 'ÚRAZU']], [9, 'DENNÍ ODŠKODNÉ'], [10, 'HOSPITALIZACE'], [11, ['PRACOVNÍ', 'NESCHOPNOST']]];
    big.forEach(([i, s]) => {

      else txt(s, colX[i], y, TK_COLS[i], H.h1 + H.h2, { size: 12.5 });

    txt('INVALIDITA', colX[6], y, colX[8] - colX[6], H.h1, { size: 12.5 });
    const subh = (i, b, n) => { doc.setFontSize(PT(9.5)); doc.setFont('BPSans', 'bold'); const bw = doc.getTextWidth(b + ' ');
      doc.setTextColor(34, 34, 34); const ty = y + H.h1 + H.h2 / 2 + PT(9.5) * 0.3528 * 0.35; doc.text(b, X(colX[i] + 14), ty); doc.setFont('BPSans', 'normal'); doc.text(n, X(colX[i] + 14) + bw, ty); };
    subh(2, 'Závazky', '(kles/konst)'); subh(3, 'Živ. úroveň', '(kles/konst)'); subh(6, 'Závazky', '(klesající)'); subh(7, 'Živ. úroveň', '(kles/konst)');

  const person = (p, y, pi) => {

    const ya = y, yb = y + H.a, yc = yb + H.b, ye = yc + H.c;

      const CC = k => C(PP(`${r}.${k}`), col);
      const money = (k, i, yy = top, hh = h, o = {}) => txt(tkKc(R[k]), colX[i], yy, o.w || TK_COLS[i], hh, Object.assign({ color: CC(k) }, o));
      txt(R.produkt, colX[1], top, TK_COLS[1], h, { size: 13, color: CC('produkt') });
      money('sZav', 2); money('sZiv', 3); money('sUraz', 4); money('vch', 5); money('dO', 9); money('pn', 11);
      // invalidita
      [['iZ', 6], ['iV', 7]].forEach(([pre, i]) => {
        const rh = (h - 6 * S) / 3;
        [1, 2, 3].forEach(n => {
          const yy = top + 3 * S + (n - 1) * rh;
          doc.setFont(r === 'a' ? 'BPSerif' : 'BPSans', r === 'a' ? 'normal' : 'bold'); doc.setFontSize(PT(10.5)); doc.setTextColor(...(r === 'b' ? GREEN_T : [34, 34, 34]));
          doc.text('I'.repeat(n) + '.', X(colX[i] + 4), yy + rh / 2 + PT(10.5) * 0.3528 * 0.35);
          txt(tkKc(R[pre + n]), colX[i] + 30, yy, TK_COLS[i] - 30, rh, { size: 12, color: CC(pre + n), align: 'left', pad: 2 });
        });
      });
      // trvalé následky + hospitalizace: dvě (u původní tři) části s tečkovanou linkou
      const parts = r === 'a' ? [33 * S, 33 * S] : [h / 2, h / 2];
      const tnx = colX[8], tnw = TK_COLS[8] - 38;
      line(X(tnx + tnw), top, X(tnx + tnw), top + parts[0] + parts[1], [181, 181, 181], 0.15);
      [['tn1', '0,1%'], ['tn2', '10%']].forEach(([f, pct], k) => {
        const yy = top + (k ? parts[0] : 0);
        money(f, 8, yy, parts[k], { w: tnw, size: 13.5 });
        doc.setFont('BPSans', 'normal'); doc.setFontSize(PT(9)); doc.setTextColor(68, 68, 68);
        [['od', -0.55], [pct, 0.55]].forEach(([s, dy]) => { const tw = doc.getTextWidth(s); doc.text(s, X(tnx + tnw) + (W(38) - tw) / 2, yy + parts[k] / 2 + dy * PT(9) * 0.3528 + PT(9) * 0.3528 * 0.35); });
      });
      const dots = [parts[0]].concat(r === 'a' ? [parts[0] + parts[1]] : []);
      dots.forEach(d => { line(X(colX[8]), top + d, X(colX[9]), top + d, [138, 138, 138], 0.15, [0.4, 0.4]); line(X(colX[10]), top + d, X(colX[11]), top + d, [138, 138, 138], 0.15, [0.4, 0.4]); });
      money('hosp', 10, top, parts[0], { size: 13.5 });
      txt('jen úraz:', colX[10], top + parts[0], 50, parts[1], { size: 9.5, style: 'normal', align: 'left', color: [68, 68, 68] });
      txt(tkKc(R.hospU), colX[10] + 50, top + parts[0], TK_COLS[10] - 50, parts[1], { size: 12, color: CC('hospU') });
    });
    // zelený pruh
    const bar = [['smrt', 2, 5], ['vch', 5, 6], ['inv', 6, 8], ['tn', 8, 9], ['dO', 9, 10], ['hosp', 10, 11], ['pn', 11, 12]];
    bar.forEach(([k, a, b]) => txt(p.c[k], colX[a], yc, colX[b] - colX[a], H.c, { size: 9.5, color: [255, 255, 255] }));
    return ye;
  };

  const footer = y => {
    const P = t.poradce;
    txt('PŮVODNÍ MĚS. POJISTNÉ:', 1240, y + 10 * S, 240, 26 * S, { size: 13, align: 'left' });
    txt(tkKc(t.pojistne) || '0 Kč', 1480, y + 10 * S, 116, 26 * S, { size: 13, align: 'right', color: C('pojistne', [34, 34, 34]) });
    const yl = y + 112 * S;
    txt('Č. pojistné smlouvy:', 0, yl, 160, 22 * S, { size: 11.5, align: 'left' });
    doc.setFont('BPSerif', 'normal'); doc.setFontSize(PT(16)); doc.setTextColor(...C('cisloSmlouvy', [0, 0, 0])); doc.text(String(t.cisloSmlouvy || ''), X(168), yl + 11 * S + PT(16) * 0.3528 * 0.35);
    txt('Souhlasím se změnami:', 0, yl + 26 * S, 400, 24 * S, { size: 15, align: 'left', color: GREEN_T });
    txt('Pojistník:', 0, yl + 62 * S, 300, 24 * S, { size: 14, align: 'left', style: 'italic', color: GREEN_T });
    line(X(0), yl + 88 * S, X(536), yl + 88 * S, GREEN_T, 0.3);
    const xr = 1358, wr = 238, yr = y + 88 * S;
    txt('Poradce:', xr, yr, 80, 22 * S, { size: 13, align: 'left', style: 'bolditalic', pad: 0 });
    txt(P.jmeno, xr + 80, yr, wr - 80, 22 * S, { size: 13, align: 'right', style: 'bolditalic', pad: 0, color: C('poradce.jmeno', [34, 34, 34]) });
    line(X(xr - 3), yr + 23 * S, X(xr + wr), yr + 23 * S, [34, 34, 34], 0.25); line(X(xr - 3), yr + 26 * S, X(xr + wr), yr + 26 * S, [34, 34, 34], 0.25);
    doc.addImage(TK_FLOGO, 'JPEG', X(xr - 9), yr + 33 * S, W(107), W(46));
    txt('Tel.:', xr, yr + 88 * S, 60, 20 * S, { size: 13, align: 'left', style: 'bolditalic', pad: 0 });
    txt(P.tel, xr + 60, yr + 88 * S, wr - 60, 20 * S, { size: 13, align: 'right', style: 'bolditalic', pad: 0, color: C('poradce.tel', [34, 34, 34]) });
    txt('Email:', xr, yr + 107 * S, 70, 20 * S, { size: 13, align: 'left', style: 'bolditalic', pad: 0 });
    txt(P.email, xr + 70, yr + 107 * S, wr - 70, 20 * S, { size: 11.5, align: 'right', style: 'normal', pad: 0, color: C('poradce.email', [122, 28, 140]), underline: true });
  };

  const pages = tkPages(t.osoby.length);
  pages.forEach(([a, b], pi) => {
    if (pi) doc.addPage('a4', 'landscape');
    let y = header(M);
    for (let i = a; i < b; i++) { if (i > a) y += H.gap; y = person(t.osoby[i], y, i); }
    if (pi === pages.length - 1) footer(y + 4 * S);
  });
  return doc.output('blob');
}
async function downloadTabulkaPDF(t) {
  infoToast('⏳ Připravuji PDF…');
  try {
    const blob = await tabulkaPDF(t);
    if (await saveFile(`tabulka-klienta-${todayYmd()}.pdf`, blob, 'application/pdf')) infoToast('✅ PDF připraveno');
  } catch (e) {
    console.warn(e);
    infoToast('PDF se nepodařilo vytvořit. Zkuste tisk do PDF (Ctrl+P → Uložit jako PDF).');
  }
}

/** Motiv: po odemčení z nastavení, na zamykací obrazovce šifrovaných dat z nešifrované kopie (uiTheme). */
function applyTheme() {
  const t = vaultOn() && !crypt.key ? store.get(THEME_KEY, 'light') : settings.theme;
  document.documentElement.dataset.appTheme = t === 'dark' ? 'dark' : 'light';
}
/** Načte všechna data z úložiště do proměnných (po odemčení šifrovaných dat). */
function reloadData() {
  events = store.get(KEYS.events, []); if (!Array.isArray(events)) events = [];
  templates = store.get(KEYS.templates, []); if (!Array.isArray(templates)) templates = [];
  settings = loadSettings();
  finSettings = loadFin();
  clients = loadClients();
  eduSettings = loadEdu();
  tkAll = loadTk();
  if (migrateColors(events)) saveEvents();
  if (migrateColors(templates)) saveTemplates();
  store.set(THEME_KEY, settings.theme);
}

// změny z jiné záložky se stejnou aplikací
window.addEventListener('storage', async e => {
  if (e.key === VAULT_KEY) {
    if (!crypt.vault) location.reload();                        // jiná záložka právě zapnula šifrování
    else if (e.newValue) crypt.vault = JSON.parse(e.newValue);  // změna PINu / kódu (datový klíč zůstává)
    return;
  }
  if (isSealedKey(e.key)) {
    if (!crypt.key) return;
    try {
      if (e.newValue == null) delete cache[e.key];
      else cache[e.key] = e.newValue.startsWith(SEALED) ? await openWith(crypt.key, e.newValue) : e.newValue;
    } catch (x) { return; }
  }
  if (e.key === KEYS.events) events = store.get(KEYS.events, []);
  else if (e.key === KEYS.templates) templates = store.get(KEYS.templates, []);
  else if (e.key === CL_KEYS.clients) clients = loadClients();
  else if (e.key === TK_KEY) {
    // tabulka rozepsaná v této záložce má přednost (poslední uložení vyhrává)
    if (tkSaveTimer || (document.activeElement && document.activeElement.closest && document.activeElement.closest('.tk-sheet'))) return;
    tkAll = loadTk();
    if (parseHash().name !== 'tabulka') return;
  }
  else return;
  if (!locked && !$('#modalRoot').firstChild) render();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkReminders(); checkClientNotifications(); } });
setInterval(checkClientNotifications, CL_CHECK_MS);
setInterval(checkReminders, CHECK_EVERY_MS);

$('#ava').src = LOGO_SRC;
/* PWA: service worker jen ve verzi pro GitHub Pages (index.html s <link rel="manifest">).
   V artefaktu na claude.ai ani v souboru otevřeném z disku se nespouští. */
if ('serviceWorker' in navigator && window.isSecureContext && document.querySelector('link[rel="manifest"]')) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(r => { swReady = r; }).catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'open' && !locked) go(e.data.hash); });
}

applyTheme();
initLock();
if (!vaultOn()) storedPinHash();     // před zapnutím šifrování: při prvním spuštění uloží hash výchozího PINu (2607)
updateBadge();
}
