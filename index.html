/** Zmenší obrázek na čtverec size×size (oříznutí na střed) → PNG data URL.
    Šetří localStorage (limit ~5 MB). */
function resizeImage(file, size) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const c = document.createElement('canvas'); c.width = c.height = size;
        const s = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
        resolve(c.toDataURL('image/png'));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* =====================================================================
   9. KNIHOVNA ČINNOSTÍ (šablony)
   Každé uložení přidá novou šablonu. Přeskočí se jen úplně shodná
   (stejný název, ikona, barva i délka) – duplicita by nic nepřinesla.
   Mazání: Nastavení → Moje činnosti.
   ===================================================================== */
function addTemplate({ title, icon, color, duration, isMeeting }) {
  isMeeting = isMeeting === true;
  if (templates.some(t => t.title === title && t.icon === icon && t.color === color && t.duration === duration && (t.isMeeting === true) === isMeeting)) return;
  templates.push({ id: uid(), title, icon, color, duration, isMeeting });
  saveTemplates();
}

/* =====================================================================
   10. UPOZORNĚNÍ A NOTIFIKACE
   ---------------------------------------------------------------------
   Upozornění fungují JEN DOKUD JE APLIKACE OTEVŘENÁ (setInterval + localStorage).
   Na mobilu prohlížeč na pozadí časovače zpomaluje nebo uspává – upozornění
   pak přijde se zpožděním, nejpozději při návratu do aplikace.

   BUDOUCÍ ROZŠÍŘENÍ – notifikace při zavřené aplikaci:
   - z aplikace udělat PWA (manifest.json + service worker, hosting přes HTTPS),
   - service worker + Push API (vyžaduje server, který push odešle ve správný čas),
     případně Notification Triggers API (zatím jen experimentální).
   Bez serveru spolehlivé notifikace při zavřeném prohlížeči udělat nejdou.
   ===================================================================== */
let audioCtx = null;
/** Prohlížeče povolí zvuk až po interakci uživatele → AudioContext odemkneme při prvním kliknutí. */
function unlockAudio() {
  try {
    if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audioCtx = new AC(); }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { /* zvuk není dostupný */ }
}
document.addEventListener('pointerdown', unlockAudio, { passive: true });
document.addEventListener('keydown', unlockAudio);

/** Krátký dvoutónový signál přes Web Audio API (bez externího souboru). */
function beep() {
  if (!audioCtx) return;
  try {
    const t = audioCtx.currentTime;
    [[0, 880], [0.22, 1175]].forEach(([d, f]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(0.25, t + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.2);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t + d); o.stop(t + d + 0.22);
    });
  } catch (e) { /* ignorovat */ }
}

/** Žádost o povolení systémových notifikací – poprvé při uložení činnosti s upozorněním. */
function requestNotifPermission(force) {
  if (!('Notification' in window) || Notification.permission !== 'default') return Promise.resolve();
  if (settings.notifAsked && !force) return Promise.resolve();
  settings.notifAsked = true; saveSettings();
  try {
    const p = Notification.requestPermission();
    return p && p.then ? p.catch(() => {}) : Promise.resolve();
  } catch (e) { return Promise.resolve(); }  // např. v sandboxovaném rámci
}
/* Service worker (jen verze z GitHub Pages – viz START). Přes něj fungují notifikace i na Androidu. */
let swReady = null;
/** Systémová notifikace; klik otevře aplikaci na dané stránce (hash). Bez service workeru může vyhodit chybu. */
function showNote(title, opts, hash) {
  if (swReady) { swReady.showNotification(title, { ...opts, data: { hash } }).catch(() => {}); return; }
  const n = new Notification(title, opts);
  n.onclick = () => { window.focus(); if (!locked) go(hash); n.close(); };
}
function browserNotify(ev) {
  if (settings.browserNotif === false || !('Notification' in window) || Notification.permission !== 'granted') return;
  try { showNote(ev.title, { body: `Začátek ${czDateShort(parseYmd(ev.date))} v ${ev.start}`, tag: ev.id }, 'den-' + ev.date); }
  catch (e) { /* Android Chrome bez service workeru – zůstane in-app toast */ }
}

/** Nadcházející (ještě neodeslaná) upozornění, seřazená podle času upozornění. */
function upcoming() {
  const now = Date.now();
  return events
    .filter(ev => ev.reminderMinutes != null && !ev.notified && eventStart(ev).getTime() > now)
    .map(ev => ({ ev, at: eventStart(ev).getTime() - ev.reminderMinutes * 60000 }))
    .sort((a, b) => a.at - b.at);
}
function upcomingListHTML(limit = 5) {

  if (!list.length) return '<p class="empty">Žádná nadcházející upozornění.</p>';

}

/** Hlavní kontrola – volá se každých 30 s, po odemčení, po uložení a při návratu do aplikace. */
function checkReminders() {
  const now = Date.now();
  let changed = false;
  for (const ev of events) {
    if (ev.reminderMinutes == null || ev.notified) continue;
    const st = eventStart(ev).getTime();
    const trigger = st - ev.reminderMinutes * 60000;
    if (now < trigger) continue;
    ev.notified = true; changed = true;           // každé upozornění jen jednou
    const end = st + ev.duration * 60000;
    if (now < end) fireReminder(ev);
    // činnost už skončila → jen tiše označit (aplikace byla zavřená)
  }
  if (changed) saveEvents();
  updateBadge();
  updateNowLine();
  if (!locked && changed && parseHash().name === 'menu' && !$('#modalRoot').firstChild) renderMenu();
}

function fireReminder(ev) {
  showReminderToast(ev);
  beep();

  if (ev.isClientReminder && ev.reminderKey) {
    const done = store.get(CL_KEYS.notified, {}) || {};
    if (done[ev.reminderKey]) return;
    done[ev.reminderKey] = true; store.set(CL_KEYS.notified, done);
  }
  browserNotify(ev);
}

  const when = mins > 0 ? `začíná v ${ev.start} (${ahead})` : `právě probíhá (od ${ev.start})`;
  const el = document.createElement('div');

/* =====================================================================
   12. FINANCE – cíle, výpočty, plnění, historie, export CSV
   ---------------------------------------------------------------------
   localStorage klíče:
     financeSettings → { ucetProcent, fondProcent, cilovaCastka, prumernaProvize, konverzniPomer, pracovniDny }
     financeHistory  → [ { id, datum, mesic, …vstupy, vysledky, naplanovaneSchuzky } ]  (max 50)
     goalCelebrated  → { "RRRR-MM": true }
   Schůzky = jen činnosti s isMeeting === true (starší bez příznaku se nepočítají).
   ===================================================================== */
const FIN_KEYS = { settings: 'financeSettings', history: 'financeHistory', celebrated: 'goalCelebrated' };
const FIN_DEFAULTS = { ucetProcent: 60, fondProcent: 40, cilovaCastka: null, prumernaProvize: null, konverzniPomer: 30, pracovniDny: 21 };
const FIN_HISTORY_LIMIT = 50;
const loadFin = () => Object.assign({}, FIN_DEFAULTS, store.get(FIN_KEYS.settings, {}));
let finSettings = loadFin();
const saveFin = () => store.set(FIN_KEYS.settings, finSettings);
const nf0 = new Intl.NumberFormat('cs-CZ', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('cs-CZ', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const kc = n => nf0.format(Math.round(n)) + ' Kč';            // „83 333 Kč“
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const toNum = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const meetTag = ev => ev.isMeeting === true ? '<span class="mtag" title="Schůzka s klientem" aria-label="Schůzka s klientem">💼</span>' : '';
const meetingsPlural = n => plural(n, 'schůzka', 'schůzky', 'schůzek');

/** Výpočet cíle (vzorce ze zadání). Smlouvy a schůzky zaokrouhleny nahoru, částky na celé Kč.
    Schůzky se počítají z ZAOKROUHLENÉHO počtu smluv (půl smlouvy uzavřít nejde).
    Vrací null, když chybí/nulové vstupy. */
function finCalc(s) {
  const { cilovaCastka: cil, prumernaProvize: avg, konverzniPomer: konv, pracovniDny: dny, ucetProcent: ucet, fondProcent: fond } = s;
  if (!(cil > 0 && avg > 0 && konv > 0 && dny > 0 && ucet > 0)) return null;
  const EPS = 1e-9;                                              // ochrana proti 10.000000000000002 → 11
  const potrebnaProvize = cil * 100 / ucet;                       // 1. cíl / (účet % / 100)
  const pocetSmluv = Math.ceil(potrebnaProvize / avg - EPS);      // 2.
  const pocetSchuzek = Math.ceil(pocetSmluv * 100 / konv - EPS);  // 3. smlouvy / (konverze / 100)
  const schuzkyNaDen = Math.round(pocetSchuzek / dny * 10) / 10;  // 4.
  const naFond = potrebnaProvize * (fond || 0) / 100;             // 5.
  return { potrebnaProvize: Math.round(potrebnaProvize), pocetSmluv, pocetSchuzek, schuzkyNaDen, naFond: Math.round(naFond) };
}
function meetingsInMonth(mk) { return events.filter(e => e.isMeeting === true && e.date.startsWith(mk + '-')).length; }
/** Plnění cíle v měsíci podle ULOŽENÉHO nastavení. null = cíl není vyplněný → prvky se skryjí. */
function goalStatus(mk) {
  const c = finCalc(finSettings);
  if (!c || !c.pocetSchuzek) return null;
  const planned = meetingsInMonth(mk);
  return { planned, needed: c.pocetSchuzek, pct: Math.round(planned / c.pocetSchuzek * 100), calc: c };
}
const monthLabel = mk => mk === monthKey(new Date()) ? 'Tento měsíc' : cap(MONTHS[Number(mk.slice(5)) - 1]);

/** Progress bar v hlavičce kalendáře. */

    <span class="gb-t"><span>${done ? '<b>✅ Cíl splněn</b> · ' : ''}${monthLabel(mk)}: ${g.planned} / ${g.needed} schůzek (${g.pct}&nbsp;%)</span><span class="gb-go">Finance →</span></span>
    <span class="bar${g.pct > 100 ? ' over' : ''}"><i style="--w:${Math.min(100, g.pct)}%"></i></span>

}

/* ---------- gratulace (jednou za měsíc) ---------- */
function fanfare() {
  if (!audioCtx) return;
  try {
    const t = audioCtx.currentTime;
    [[0, 523.25], [0.14, 659.25], [0.28, 783.99]].forEach(([d, f], i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      const len = i === 2 ? 0.45 : 0.18;
      g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(0.25, t + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + len);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t + d); o.stop(t + d + len + 0.02);
    });
  } catch (e) { /* zvuk nedostupný */ }
}
function showCelebration(g) {

function checkGoalCelebration(mk) {
  const g = goalStatus(mk);
  if (!g || g.planned < g.needed) return;
  const cel = store.get(FIN_KEYS.celebrated, {}) || {};
  if (cel[mk]) return;
  cel[mk] = true; store.set(FIN_KEYS.celebrated, cel);
  showCelebration(g);
}

/* ---------- týdny měsíce pro graf ---------- */
function monthWeeks(mk) {
  const [y, m] = mk.split('-').map(Number);
  const first = new Date(y, m - 1, 1), last = new Date(y, m, 0);
  const weeks = [];
  for (let ws = startOfWeek(first); ws <= last; ws = addDays(ws, 7)) {
    const from = ws < first ? first : ws, we = addDays(ws, 6), to = we > last ? last : we;
    let workdays = 0;
    for (let d = new Date(from); d <= to; d = addDays(d, 1)) if (dowIdx(d) < 5) workdays++;
    const fromK = ymd(from), toK = ymd(to);
    const count = events.filter(e => e.isMeeting === true && e.date >= fromK && e.date <= toK).length;
    weeks.push({ label: `${from.getDate()}.–${to.getDate()}.`, workdays, count, current: todayYmd() >= fromK && todayYmd() <= toK });
  }
  return weeks;
}

    I('fToCal').onclick = () => go('kalendar');

    // graf po týdnech (vlastní HTML/CSS, bez knihoven)
    const weeks = monthWeeks(mk), wdTotal = weeks.reduce((a, w) => a + w.workdays, 0) || 1;
    weeks.forEach(w => w.target = c ? c.pocetSchuzek * w.workdays / wdTotal : 0);
    const max = Math.max(1, ...weeks.map(w => Math.max(w.count, w.target)));
    I('fChart').innerHTML = `<div class="wchart" role="img" aria-label="Naplánované schůzky po týdnech: ${weeks.map(w => `${w.label} ${w.count}${c ? ' z cíle ' + Math.ceil(w.target) : ''}`).join(', ')}">
      ${weeks.map(w => {
        const hit = c && w.count >= w.target - 1e-9;
        return `<div class="wcol${w.current ? ' cur' : ''}">
          <div class="wplot">
            <span class="wval" style="bottom:calc(${w.count / max * 100}% + 4px)">${w.count}</span>
            <span class="wbar${hit ? ' hit' : ''}" style="height:${w.count / max * 100}%"></span>
            ${c ? `<span class="wtarget" style="bottom:${w.target / max * 100}%" title="Cíl týdne: ${nf1.format(w.target)}"></span>` : ''}
          </div>
          <span class="wlab">${w.label}</span>
        </div>`;
      }).join('')}
    </div>
    <p class="legend"><span class="lg-bar"></span>naplánováno <span class="lg-bar hit"></span>cíl týdne splněn ${c ? '<span class="lg-line"></span>cíl týdne (podle pracovních dní)' : ''}</p>`;

    // přehled rozdělení
    const u = cur.ucetProcent, f = cur.fondProcent;
    I('fSplit').innerHTML = `<div class="split" role="img" aria-label="Na účet ${u} %, na rezervní fond ${f} %">
        <span class="sa" style="flex:${u}">${u >= 15 ? `Účet ${nf0.format(u)}&nbsp;%` : ''}</span>
        <span class="sf" style="flex:${f}">${f >= 15 ? `Fond ${nf0.format(f)}&nbsp;%` : ''}</span></div>
      <dl class="kv">
        <dt><i class="dot sa"></i>Na účet: ${nf0.format(u)} %</dt><dd>${c ? kc(c.potrebnaProvize - c.naFond) : '–'}</dd>
        <dt><i class="dot sf"></i>Na rezervní fond: ${nf0.format(f)} %</dt><dd>${c ? kc(c.naFond) : '–'}</dd>
      </dl>`;
    return { c, cur };
  };

  // procenta – automatický dopočet druhé hodnoty
  const pair = (src, dst) => I(src).addEventListener('input', () => {
    const x = toNum(I(src).value);
    if (x != null && x >= 0 && x <= 100) I(dst).value = Math.round((100 - x) * 100) / 100;
    I('fSetMsg').textContent = '';
    update();
  });
  pair('fUcet', 'fFond'); pair('fFond', 'fUcet');
  ['fCil', 'fAvg', 'fKonv', 'fDny'].forEach(id => I(id).addEventListener('input', () => { I('fCalcMsg').textContent = ''; update(); }));

  I('fSaveSet').onclick = () => {
    const { ok, s: cur } = read(); if (!ok) return;
    finSettings.ucetProcent = cur.ucetProcent; finSettings.fondProcent = cur.fondProcent; saveFin();
    I('fSetMsg').className = 'msg ok'; I('fSetMsg').textContent = 'Uloženo ✓';
  };

  I('fSaveCalc').onclick = () => {
    const { c, cur } = update();
    if (!c) { I('fCalcMsg').className = 'msg bad'; I('fCalcMsg').textContent = 'Nejdřív vyplňte všechny hodnoty.'; return; }
    const now = new Date(), list = store.get(FIN_KEYS.history, []) || [];
    list.unshift({ id: now.getTime(), datum: now.toISOString(), mesic: monthKey(now),
      cilovaCastka: cur.cilovaCastka, prumernaProvize: cur.prumernaProvize, konverzniPomer: cur.konverzniPomer, pracovniDny: cur.pracovniDny,
      ucetProcent: cur.ucetProcent, fondProcent: cur.fondProcent, vysledky: c, naplanovaneSchuzky: meetingsInMonth(monthKey(now)) });
    store.set(FIN_KEYS.history, list.slice(0, FIN_HISTORY_LIMIT));            // max 50, starší se zahodí
    renderFinance();
    $('#fCalcMsg').className = 'msg ok'; $('#fCalcMsg').textContent = 'Výpočet uložen do historie ✓';
  };

  armConfirm(I('fReset'), 'Opravdu resetovat?', () => {
    finSettings = Object.assign({}, FIN_DEFAULTS); saveFin(); renderFinance();
    $('#fCalcMsg').className = 'msg ok'; $('#fCalcMsg').textContent = 'Hodnoty resetovány.';
  });

  renderHistory(history);
  update();
}

/** Dvoukrokové potvrzení tlačítka (confirm() je v některých prostředích blokovaný). */
function armConfirm(btn, askText, action) {
  if (!btn) return;
  const orig = btn.textContent; let armed = false, t;
  btn.onclick = () => {
    if (!armed) { armed = true; btn.textContent = askText; t = setTimeout(() => { armed = false; btn.textContent = orig; }, 3000); return; }
    clearTimeout(t); action();
  };
}

function fmtStamp(iso) { const d = new Date(iso); return `${d.getDate()}. ${d.getMonth() + 1}. ${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function renderHistory(list) {
  const box = $('#fHist');
  if (!list.length) { box.innerHTML = '<p class="empty">Zatím žádné uložené výpočty. Uložíte je tlačítkem „Uložit výpočet“.</p>'; return; }
  box.innerHTML = `<div class="hist">${list.map(h => {
    const r = h.vysledky || {};
    return `<details class="hitem" data-id="${h.id}">
      <summary><span><b>${fmtStamp(h.datum)}</b><small>${kc(h.cilovaCastka)} · ${r.pocetSchuzek} ${meetingsPlural(r.pocetSchuzek)}</small></span><span class="chev" aria-hidden="true">›</span></summary>
      <dl class="kv">
        <dt>Měsíc</dt><dd>${h.mesic}</dd>
        <dt>Cílová částka</dt><dd>${kc(h.cilovaCastka)}</dd>
        <dt>Rozdělení účet / fond</dt><dd>${nf0.format(h.ucetProcent)} % / ${nf0.format(h.fondProcent)} %</dd>
        <dt>Průměrná provize</dt><dd>${kc(h.prumernaProvize)}</dd>
        <dt>Konverzní poměr</dt><dd>${nf0.format(h.konverzniPomer)} %</dd>
        <dt>Pracovních dní</dt><dd>${h.pracovniDny}</dd>
        <dt>Potřebná provize</dt><dd>${kc(r.potrebnaProvize)}</dd>
        <dt>Na fond</dt><dd>${kc(r.naFond)}</dd>
        <dt>Potřebných smluv</dt><dd>${r.pocetSmluv}</dd>
        <dt>Potřebných schůzek</dt><dd>${r.pocetSchuzek}</dd>
        <dt>Schůzek na den</dt><dd>${nf1.format(r.schuzkyNaDen)}</dd>
        <dt>Naplánováno v době uložení</dt><dd>${h.naplanovaneSchuzky}</dd>
      </dl>
      <div class="btn-row"><button class="btn small primary" data-load="${h.id}">Načíst</button><button class="btn small danger" data-del="${h.id}">Smazat</button></div>
    </details>`;
  }).join('')}</div>`;

  box.querySelectorAll('[data-load]').forEach(b => b.onclick = () => {
    const h = list.find(x => String(x.id) === b.dataset.load); if (!h) return;
    $('#fUcet').value = h.ucetProcent; $('#fFond').value = h.fondProcent;
    $('#fCil').value = h.cilovaCastka; $('#fAvg').value = h.prumernaProvize; $('#fKonv').value = h.konverzniPomer; $('#fDny').value = h.pracovniDny;
    $('#fCil').dispatchEvent(new Event('input'));
    const pctChanged = h.ucetProcent !== finSettings.ucetProcent;
    $('#fCalcMsg').className = 'msg ok';
    $('#fCalcMsg').textContent = 'Načteno z historie.' + (pctChanged ? ' Procenta uložíte tlačítkem „Uložit nastavení“.' : '');
    $('#view').scrollTo({ top: 0, behavior: 'smooth' });
  });
  box.querySelectorAll('[data-del]').forEach(b => armConfirm(b, 'Opravdu?', () => {
    store.set(FIN_KEYS.history, (store.get(FIN_KEYS.history, []) || []).filter(x => String(x.id) !== b.dataset.del));
    renderFinance();
  }));
  armConfirm($('#fClearAll'), 'Opravdu smazat vše?', () => { store.set(FIN_KEYS.history, []); renderFinance(); });
  const ex = $('#fExport'); if (ex) ex.onclick = () => exportHistoryCSV(list);
}

/* ---------- export CSV ---------- */
function historyRows(list) {
  const dec = x => x == null ? '' : String(x).replace('.', ',');       // desetinná čárka
  const stamp = iso => { const d = new Date(iso); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const head = ['Datum', 'Měsíc', 'Cílová částka (Kč)', '% na účet', '% na fond', 'Průměrná provize (Kč)', 'Konverzní poměr (%)', 'Pracovních dní',
    'Potřebná provize (Kč)', 'Na fond (Kč)', 'Potřebných smluv', 'Potřebných schůzek', 'Schůzek na den', 'Naplánovaných schůzek'];
  const rows = list.map(h => { const r = h.vysledky || {}; return [stamp(h.datum), h.mesic, h.cilovaCastka, h.ucetProcent, h.fondProcent, h.prumernaProvize,
    h.konverzniPomer, h.pracovniDny, r.potrebnaProvize, r.naFond, r.pocetSmluv, r.pocetSchuzek, r.schuzkyNaDen, h.naplanovaneSchuzky]
    .map((x, i) => i < 2 ? x : dec(x)); });   // datum a měsíc beze změny, čísla s desetinnou čárkou
  return [head, ...rows];
}
async function exportHistoryCSV(list) {
  if (!list.length) return;
  const rows = historyRows(list);
  const csv = '\uFEFF' + rows.map(r => r.join(';')).join('\r\n');      // UTF-8 s BOM, středník
  const name = `benefit-planner-historie-${todayYmd()}.csv`;

  // 1) Online verze (claude.ai): stahování přes schválenou funkci „downloads“ – uživatelka potvrdí uložení.
  let dl = null;
  try { if (window.claude && typeof window.claude.use === 'function') dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename: name, data: csv }); infoToast('✅ Historie exportována'); }
    catch (err) {
      if (err && err.code === 'declined') infoToast('Export zrušen.');
      else copyRowsFallback(rows);
    }
    return;
  }
  // 2) Samostatný HTML soubor: klasické stažení přes Blob + URL.createObjectURL
  try {
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    infoToast('✅ Historie exportována');
  } catch (e) { copyRowsFallback(rows); }
}
/** Záloha, když stažení nejde: tabulka do schránky (oddělená tabulátory → vložení do Excelu). */
function copyRowsFallback(rows) {
  if (!navigator.clipboard) { infoToast('Stažení se nezdařilo.'); return; }
  navigator.clipboard.writeText(rows.map(r => r.join('\t')).join('\n'))
    .then(() => infoToast('Stažení tu nejde – tabulka je ve schránce, vložte ji do Excelu (Ctrl+V).'))
    .catch(() => infoToast('Stažení se nezdařilo.'));
}

/* --- formátování a validace --- */
const czDateWords = s => { const d = parseYmd(s); return `${d.getDate()}. ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}`; };
const czDateNum = s => { const d = parseYmd(s); return `${d.getDate()}. ${d.getMonth() + 1}. ${d.getFullYear()}`; };
const slugify = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
/** PSČ: 5 číslic s mezerou nebo bez → „123 45“; jinak null */
const normPsc = v => { const d = String(v || '').replace(/\s/g, ''); return /^\d{5}$/.test(d) ? `${d.slice(0, 3)} ${d.slice(3)}` : null; };
/** Rodné číslo: 6 číslic + (lomítko) + 3–4 číslice → „XXXXXX/XXXX“; jinak null */
const normRc = v => { const m = /^(\d{6})\/?(\d{3,4})$/.exec(String(v || '').replace(/\s/g, '')); return m ? `${m[1]}/${m[2]}` : null; };
const isCR = s => !s || /^česk[áa] republika$/i.test(s.trim()) || /^(čr|cr|cz)$/i.test(s.trim());

function recordToForm(h) {
  const a = h.adresaPojistovny || {}, k = h.udajeKlienta || {}, ka = k.adresa || {};
  return { pojNazev: h.nazevPojistovny || '', pojUlice: a.ulice || '', pojPsc: a.psc || '', pojMesto: a.mesto || '', pojStat: a.stat || 'Česká republika',
    kJmeno: k.jmeno || '', kPrijmeni: k.prijmeni || '', kRc: k.rodneCislo || '', kUlice: ka.ulice || '', kPsc: ka.psc || '', kMesto: ka.mesto || '',
    cisloSmlouvy: h.cisloSmlouvy || '', produkt: h.produkt || '', datumPocatkuSmlouvy: h.datumPocatkuSmlouvy || '',

}

/* --- obsah dopisu po blocích (pořadí a texty podle vzoru) --- */
function letterBlocks(rec) {
  const a = rec.adresaPojistovny || {}, k = rec.udajeKlienta || {}, ka = k.adresa || {};
  const T = DOC_TYPES[rec.typ] || DOC_TYPES.vypoved;
  const F = (val, ph, extra) => val ? { t: val, ...extra } : { t: `[${ph}]`, ph: true, ...extra };   // prázdné = zástupný text
  const name = [F(k.jmeno, 'JMÉNO'), { t: ' ' }, F(k.prijmeni, 'PŘÍJMENÍ')];
  const N = F(rec.cisloSmlouvy, 'ČÍSLO SMLOUVY');
  const reason = (rec.duvod || '').trim();
  const body = [T.sentence(N)];
  if (reason) reason.split(/\n+/).forEach((p, i) => body.push([{ t: (i === 0 ? T.reasonPrefix : '') + p.trim() }]));
  else if (T.reasonRequired) body.push([{ t: T.reasonPrefix }, F('', 'POŽADOVANÁ ZMĚNA')]);
  body.push([{ t: 'Děkuji, potvrzení mi zašlete na výše uvedenou adresu.' }]);
  const insurer = [[F(rec.nazevPojistovny, 'NÁZEV POJIŠŤOVNY', { b: true })], [F(a.ulice, 'ULICE A Č. P.')],
    [F(a.psc, 'PSČ'), { t: ' ' }, F(a.mesto, 'MĚSTO')]];
  if (!isCR(a.stat)) insurer.push([{ t: a.stat.trim() }]);

/* --- měření a zalamování (stejné písmo jako v PDF) --- */
let measureCtx = null;
function measureMM(t, bold) {
  if (!measureCtx) measureCtx = document.createElement('canvas').getContext('2d');
  measureCtx.font = `${bold ? 700 : 400} ${FONT_PT * 96 / 72}px "BP Serif", "Times New Roman", Times, serif`;   // pt → px
  return measureCtx.measureText(t).width / MM2PX;
}
function wrapRuns(runs, maxW) {
  const toks = [];
  runs.forEach(r => String(r.t).split(/(\s+)/).forEach(p => { if (p) toks.push({ ...r, t: p, sp: /^\s+$/.test(p) }); }));
  const lines = []; let cur = [], w = 0;
  const flush = () => {
    while (cur.length && cur[cur.length - 1].sp) cur.pop();
    const merged = [];
    cur.forEach(tk => { const last = merged[merged.length - 1]; if (last && !!last.b === !!tk.b && !!last.ph === !!tk.ph) last.t += tk.t; else merged.push({ t: tk.t, b: tk.b, ph: tk.ph }); });
    lines.push(merged); cur = []; w = 0;
  };
  for (const tk of toks) {
    const tw = measureMM(tk.sp ? ' ' : tk.t, tk.b);
    if (tk.sp) { if (cur.length) { cur.push({ ...tk, t: ' ' }); w += tw; } continue; }
    if (cur.length && w + tw > maxW) flush();
    cur.push(tk); w += tw;
  }
  if (cur.length || !lines.length) flush();
  return lines;
}
/** Rozložení na stránky: [{ page, top (mm, horní hrana písma), runs }] */
function layoutLetter(rec) {
  const lines = []; let page = 0, cursor = null;   // cursor = horní hrana dalšího volného řádku
  for (const blk of letterBlocks(rec)) {
    let top = cursor == null ? SLOTS[blk.slot] : (page === 0 ? Math.max(SLOTS[blk.slot], cursor + LINE_H) : cursor + LINE_H);
    for (const para of blk.paras) for (const ln of wrapRuns(para, TEXT_W)) {
      if (top + ASC > BASELINE_MAX) { page++; top = MARGIN_TOP_NEXT; }
      lines.push({ page, top, x: SLOT_X[blk.slot] || MARGIN_L, runs: ln });
      top += LINE_H;
    }
    cursor = top;
  }
  return { pages: page + 1, lines };
}

/* --- písmo pro náhled (FontFace z vloženého TTF) --- */
let letterFontsReady = null;
function ensureLetterFonts() {
  if (!letterFontsReady) {
    const mk = (b64, weight) => new FontFace('BP Serif', `url(data:font/ttf;base64,${b64})`, { weight });
    letterFontsReady = Promise.all([mk(FONT_REG_B64, '400').load(), mk(FONT_BOLD_B64, '700').load()])
      .then(fs => { fs.forEach(f => document.fonts.add(f)); measureCtx = null; })
      .catch(() => { /* záložně Times New Roman */ });
  }
  return letterFontsReady;
}
/** HTML stránek A4 (náhled i tisk). */
function pagesHTML(layout) {
  let html = '';
  for (let p = 0; p < layout.pages; p++) {
    html += `<div class="a4">${layout.lines.filter(l => l.page === p).map(l =>
      `<div class="ln" style="top:${(l.top - HALF_LEAD).toFixed(2)}mm;left:${l.x}mm">${l.runs.map(r => {
        const t = esc(r.t); return r.ph ? `<mark>${t}</mark>` : r.b ? `<b>${t}</b>` : t; }).join('')}</div>`).join('')}</div>`;
  }

}
let a4Observer = null;
function fitPreview(wrap = $('#a4Wrap')) {
  if (!wrap || !wrap.isConnected) return;
  const stack = wrap.firstElementChild, n = stack.children.length || 1;
  const s = wrap.clientWidth / (PAGE_W * MM2PX);
  stack.style.setProperty('--s', s);
  wrap.style.height = ((n * PAGE_H + (n - 1) * 8) * MM2PX * s) + 'px';
}

/* --- PDF (jsPDF z CDN, načte se až při prvním použití) --- */
let jspdfPromise = null;
function loadJsPDF() {
  if (window.jspdf) return Promise.resolve(window.jspdf);
  if (!jspdfPromise) jspdfPromise = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = JSPDF_URL; s.async = true;
    s.onload = () => window.jspdf ? res(window.jspdf) : rej(new Error('jsPDF'));
    s.onerror = () => { jspdfPromise = null; rej(new Error('jsPDF')); };
    document.head.appendChild(s);
  });
  return jspdfPromise;
}
async function letterPDF(rec) {
  const { jsPDF } = await loadJsPDF();
  const layout = layoutLetter(rec);
  const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
  doc.addFileToVFS('BPSerif-Regular.ttf', FONT_REG_B64); doc.addFont('BPSerif-Regular.ttf', 'BPSerif', 'normal');
  doc.addFileToVFS('BPSerif-Bold.ttf', FONT_BOLD_B64); doc.addFont('BPSerif-Bold.ttf', 'BPSerif', 'bold');
  doc.setFontSize(FONT_PT); doc.setTextColor(0, 0, 0);
  doc.setProperties({ title: runsText(letterBlocks(rec)[3].paras[0]), creator: 'Benefit Planner' });
  for (let p = 0; p < layout.pages; p++) {
    if (p > 0) doc.addPage('a4', 'portrait');
    layout.lines.filter(l => l.page === p).forEach(l => {
      let x = l.x;
      l.runs.forEach(r => { doc.setFont('BPSerif', r.b ? 'bold' : 'normal'); doc.text(r.t, x, l.top + ASC); x += doc.getTextWidth(r.t); });
    });
  }
  return doc.output('blob');
}
const letterFileName = (rec, ext) => [DOC_TYPES[rec.typ]?.file || 'vypoved', slugify(rec.udajeKlienta?.prijmeni) || 'klient',
  slugify(rec.cisloSmlouvy) || 'smlouva', rec.datumPodpisu || todayYmd()].join('-') + '.' + ext;
async function downloadLetterPDF(rec) {
  infoToast('⏳ Připravuji PDF…');
  try {
    const blob = await letterPDF(rec);
    if (await saveFile(letterFileName(rec, 'pdf'), blob, 'application/pdf')) infoToast('✅ PDF připraveno');
  } catch (e) { infoToast('PDF se nepodařilo vytvořit (knihovna jsPDF se nenačetla – je potřeba připojení k internetu).'); }
}

/* --- tisk (CSS @media print: A4, okraje 0, jen stránky dokumentu) --- */
function printLetter(rec) {
  let sheet = $('#printSheet');
  if (!sheet) { sheet = document.createElement('div'); sheet.id = 'printSheet'; document.body.appendChild(sheet); }
  sheet.innerHTML = pagesHTML(layoutLetter(rec));
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  let framed = true; try { framed = window.self !== window.top; } catch (e) { /* cizí rámec */ }
  try { window.print(); } catch (e) { /* blokováno */ }
  if (framed) { setTimeout(done, 1500); infoToast('Pokud se tiskový dialog neotevřel (online náhled tisk blokuje), stáhněte PDF a vytiskněte ho.'); }
}

/* --- obecné: uložení souboru, schránka --- */
async function saveFile(filename, data, mime) {
  let dl = null;
  try { if (window.claude && typeof window.claude.use === 'function') dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data }); return true; }
    catch (err) { if (err && err.code === 'declined') { infoToast('Stažení zrušeno.'); return false; } infoToast('Stažení tu nejde – použijte Kopírovat.'); return false; }
  }
  try {
    const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type: mime }));
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    return true;
  } catch (e) { infoToast('Stažení se nezdařilo – použijte Kopírovat.'); return false; }
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); infoToast('✅ Zkopírováno do schránky'); }
  catch (e) { infoToast('Schránka není dostupná – text označte a zkopírujte ručně.'); }
}

/** CSV: středník, UTF-8 s BOM, texty v uvozovkách (uvozovky zdvojené). Rodné číslo se z bezpečnostních důvodů neexportuje. */
async function exportVypovediCSV(list) {
  if (!list.length) return;
  const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const stamp = iso => { const d = new Date(iso); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const dmy = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}.${m}.${y}`; };
  const addr = a => a ? [a.ulice, [a.psc, a.mesto].filter(Boolean).join(' ')].filter(Boolean).join(', ') : '';
  const head = ['Datum uložení', 'Typ', 'Pojišťovna', 'Adresa pojišťovny', 'Číslo smlouvy', 'Produkt', 'Klient', 'Adresa klienta',
    'Místo podpisu', 'Datum podpisu', 'Počátek smlouvy', 'Ukončení smlouvy', 'Důvod', 'Text dokumentu'];
  const rows = list.map(h => [stamp(h.datumVytvoreni), q(DOC_TYPES[h.typ]?.label || 'Výpověď'), q(h.nazevPojistovny), q(addr(h.adresaPojistovny)),
    q(h.cisloSmlouvy), q(h.produkt), q(klientName(h)), q(addr(h.udajeKlienta?.adresa)), q(h.mistoPodpisu),
    dmy(h.datumPodpisu), dmy(h.datumPocatkuSmlouvy), dmy(h.datumUkonceniSmlouvy), q(h.duvod), q(h.vygenerovanyText)].join(';'));
  const csv = '﻿' + [head.join(';'), ...rows].join('\r\n');
  if (await saveFile(`benefit-planner-dokumenty-${todayYmd()}.csv`, csv, 'text/csv;charset=utf-8')) infoToast('✅ Historie exportována');
}

/* =====================================================================
   14. KLIENTI – databáze klientů, produkty, důležitá data, historie úprav, upozornění
   ---------------------------------------------------------------------
   localStorage:
     clients                 → [ { id, jmeno, prijmeni, datumNarozeni, rodneCislo, telefon, email, adresa, poznamka,
                                   produkty, pripominkaVyroci, narozeniny, svatek, ostatniOsoby,
                                   datumVytvoreni, datumPosledniUpravy } ]
     clientHistory           → [ { id, clientId, datumUpravy, typZmeny, zmeny:[{pole, staraHodnota, novaHodnota}], uzivatel, snapshot? } ] (max 200)
     dismissedClientWarnings → [ id upozornění ]  (id obsahuje datum výskytu → za rok se upozornění objeví znovu)
     notifiedEvents          → { "[clientId]-[typ]-[datum]": true }
   Výročí, narozeniny a svátky se opakují každý rok (29. 2. → v nepřestupném roce 28. 2.).

   NOTIFIKACE PŘI ZAVŘENÉ APLIKACI: fungují jen při otevřené aplikaci (setInterval). Pro notifikace
   při zavřené aplikaci je potřeba PWA + service worker + push ze serveru (budoucí rozšíření).
   ===================================================================== */
const CL_KEYS = { clients: 'clients', history: 'clientHistory', dismissed: 'dismissedClientWarnings', notified: 'notifiedEvents' };
const CL_HISTORY_LIMIT = 200;
const CL_CHECK_MS = 30 * 60 * 1000;            // kontrola blížících se událostí každých 30 minut
const PRODUCTS = [
  { k: 'zivotni', ic: '🛡️', label: 'Životní pojištění', kind: 'count', multi: true },
  { k: 'auto', ic: '🚗', label: 'Auto pojištění', kind: 'count', autoType: true },
  { k: 'majetek', ic: '🏠', label: 'Majetkové pojištění', kind: 'count' },
  { k: 'edward', ic: '📈', label: 'Investice Edward', kind: 'invest' },
  { k: 'goldcoins', ic: '🪙', label: 'Goldcoins', kind: 'invest' },
  { k: 'doporuceni', ic: '👥', label: 'Doporučení', kind: 'ref' },
];
const AUTO_TYPES = { povinne: 'Povinné', havarijni: 'Havarijní', obe: 'Povinné i havarijní' };
const CHANGE_TYPES = { vytvoreni: 'Vytvoření', uprava: 'Úprava', smazani: 'Smazání' };

let clients = [];   // načtení: loadClients() (níže, potřebuje normalizeClient)
const saveClients = () => store.set(CL_KEYS.clients, clients);
const clName = c => `${c.jmeno || ''} ${c.prijmeni || ''}`.trim();
const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const isEmail = s => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s);
const numOr0 = v => { const n = toNum(v); return n != null && n >= 0 ? n : 0; };
const kcOrDash = v => v ? kc(v) : '—';
const dOrDash = s => s ? czDateNum(s) : '—';

function emptyClient() {
  return { id: '', jmeno: '', prijmeni: '', datumNarozeni: '', rodneCislo: '', telefon: '', email: '', adresa: '', poznamka: '',
    produkty: {
      zivotni: { pocet: 0, vyroci: [''] },
      auto: { pocet: 0, typ: 'povinne', vyroci: '' },
      majetek: { pocet: 0, vyroci: '' },
      edward: { vklad: null, mesicne: null, vyroci: '', poznamka: '' },
      goldcoins: { vklad: null, mesicne: null, vyroci: '', poznamka: '' },
      doporuceni: { pocet: 0, schuzky: 0, poznamka: '' },
    },
    pripominkaVyroci: 14, narozeniny: { datum: '', dni: 7 }, svatek: { datum: '', nazev: '', dni: 3 },
    ostatniOsoby: [], datumVytvoreni: '', datumPosledniUpravy: '' };
}
/** Doplní chybějící pole (starší / neúplné záznamy). */
function normalizeClient(c) {
  const e = emptyClient(), p = c.produkty || {};
  const out = Object.assign(e, c, {
    narozeniny: Object.assign(e.narozeniny, c.narozeniny), svatek: Object.assign(e.svatek, c.svatek),
    ostatniOsoby: Array.isArray(c.ostatniOsoby) ? c.ostatniOsoby : [] });
  out.produkty = {};
  PRODUCTS.forEach(({ k }) => out.produkty[k] = Object.assign({}, e.produkty[k], p[k]));
  if (!Array.isArray(out.produkty.zivotni.vyroci)) out.produkty.zivotni.vyroci = [out.produkty.zivotni.vyroci || ''];
  return out;
}
function loadClients() { const l = store.get(CL_KEYS.clients, []); return Array.isArray(l) ? l.map(normalizeClient) : []; }
clients = loadClients();
const productCount = c => {
  const p = c.produkty;
  return numOr0(p.zivotni.pocet) + numOr0(p.auto.pocet) + numOr0(p.majetek.pocet)
    + (p.edward.vklad || p.edward.mesicne ? 1 : 0) + (p.goldcoins.vklad || p.goldcoins.mesicne ? 1 : 0);
};

/* --- opakující se data: nejbližší výskyt od dneška --- */
function nextOcc(s) {
  if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
  const [, m, d] = s.split('-').map(Number);
  const t = parseYmd(todayYmd());
  const at = y => new Date(y, m - 1, Math.min(d, new Date(y, m, 0).getDate()));   // 29. 2. → 28. 2.
  let o = at(t.getFullYear()); if (o < t) o = at(t.getFullYear() + 1);
  return { date: o, ymd: ymd(o), days: Math.round((o - t) / 864e5) };
}
/** Všechny důležité události klienta (nejbližší výskyt). */
function clientEvents(c) {
  const out = [], name = clName(c);
  const add = (typ, ic, label, src, dni, extra = {}) => {
    const o = nextOcc(src); if (!o) return;
    out.push({ key: `${c.id}-${typ}-${o.ymd}`, typ, ic, label, date: o.date, ymd: o.ymd, days: o.days,
      dni: Number.isFinite(+dni) ? +dni : 7, clientId: c.id, clientName: name, ...extra });
  };
  const born = c.narozeniny.datum || c.datumNarozeni;
  const age = born && /^\d{4}/.test(born) ? (nextOcc(born)?.date.getFullYear() - Number(born.slice(0, 4))) : null;
  add('narozeniny', '🎂', 'Narozeniny', born, c.narozeniny.dni, { age: age > 0 && age < 130 ? age : null });
  add('svatek', '🎉', 'Svátek' + (c.svatek.nazev ? ` (${c.svatek.nazev})` : ''), c.svatek.datum, c.svatek.dni);
  const p = c.produkty;
  (p.zivotni.vyroci || []).forEach((d, i) => add(`vyroci:zivotni:${i}`, '💍', 'Výročí smlouvy', d, c.pripominkaVyroci, { product: 'Životní pojištění' + (p.zivotni.vyroci.filter(Boolean).length > 1 ? ` ${i + 1}` : '') }));
  [['auto', 'Auto pojištění'], ['majetek', 'Majetkové pojištění'], ['edward', 'Investice Edward'], ['goldcoins', 'Goldcoins']]
    .forEach(([k, l]) => add(`vyroci:${k}`, '💍', 'Výročí smlouvy', p[k].vyroci, c.pripominkaVyroci, { product: l }));
  c.ostatniOsoby.forEach(o => {
    const who = [o.vztah, o.jmeno].filter(Boolean).join(' ') || 'osoba';
    add(`osoba:${o.id}:narozeniny`, '🎂', `Narozeniny – ${who}`, o.narozeniny, o.dni ?? settings.clientRemindDefault);
    add(`osoba:${o.id}:svatek`, '🎉', `Svátek – ${who}`, o.svatek, o.dni ?? settings.clientRemindDefault);
  });
  return out.sort((a, b) => a.days - b.days);
}
const eventTitle = e => `${e.label}${e.product ? ' – ' + e.product : ''}`;
const inDays = d => d === 0 ? 'dnes' : d === 1 ? 'zítra' : `za ${d} ${plural(d, 'den', 'dny', 'dní')}`;
/** Aktivní upozornění (blíží se do X dní podle připomínky). */
function clientWarnings(includeDismissed = false) {
  const dis = new Set(store.get(CL_KEYS.dismissed, []) || []);
  return clients.flatMap(clientEvents).filter(e => e.days <= e.dni && (includeDismissed || !dis.has(e.key))).sort((a, b) => a.days - b.days);
}
function updateClientBadge() {
  const b = $('#clBadge'); if (!b) return;
  const n = clientWarnings().length;
  b.hidden = !n; b.textContent = n > 99 ? '99+' : n;
}

/* --- browser notifikace (jen při otevřené aplikaci, každá událost jen jednou) --- */
function checkClientNotifications() {
  if (locked) return;
  updateClientBadge();
  if (settings.browserNotif === false || !('Notification' in window) || Notification.permission !== 'granted') return;
  const done = store.get(CL_KEYS.notified, {}) || {};
  let changed = false;
  for (const e of clientWarnings(true)) {
    if (done[e.key]) continue;
    const isWish = e.typ === 'narozeniny' || e.typ === 'svatek' || e.typ.startsWith('osoba:');
    const title = `${e.ic} Blíží se ${e.label.charAt(0).toLowerCase() + e.label.slice(1)}${e.product ? ' – ' + e.product : ''} – ${e.clientName}`;
    const when = `${e.date.getDate()}. ${MONTHS_GEN[e.date.getMonth()]}`;
    const body = e.days === 0 ? `Je to dnes (${when}).${isWish ? ' Nezapomeňte poblahopřát!' : ''}`
      : `${isWish ? (e.typ.endsWith('svatek') ? 'Svátek' : 'Narozeniny') + ' má' : 'Výročí je'} ${inDays(e.days)} (${when}).${isWish ? ' Nezapomeňte poblahopřát!' : ''}`;
    try {
      showNote(title, { body, tag: e.key, icon: LOGO_SRC }, 'klient-' + e.clientId);
      done[e.key] = true; changed = true;
    } catch (err) { break; }   // např. Android bez service workeru
  }
  if (changed) store.set(CL_KEYS.notified, done);
}
/** Po úpravě klienta smazat příznaky odeslání, které už neodpovídají aktuálním datům (→ notifikace půjde znovu). */
function resetClientNotified(c) {
  const done = store.get(CL_KEYS.notified, {}) || {}, keep = new Set(clientEvents(c).map(e => e.key));
  Object.keys(done).forEach(k => { if (k.startsWith(c.id + '-') && !keep.has(k)) delete done[k]; });
  store.set(CL_KEYS.notified, done);
}

/* --- historie úprav --- */
function clientFields(c) {
  const f = [], P = (l, v) => f.push([l, v == null || v === '' ? '—' : String(v)]), p = c.produkty;
  P('Jméno', c.jmeno); P('Příjmení', c.prijmeni); P('Datum narození', c.datumNarozeni && dOrDash(c.datumNarozeni));
  P('Rodné číslo', c.rodneCislo); P('Telefon', c.telefon); P('E-mail', c.email); P('Adresa', c.adresa); P('Poznámka', c.poznamka);
  P('Počet životních smluv', p.zivotni.pocet); P('Životní pojištění – výročí smluv', p.zivotni.vyroci.filter(Boolean).map(czDateNum).join(', '));
  P('Počet auto smluv', p.auto.pocet); P('Auto pojištění – typ', AUTO_TYPES[p.auto.typ]); P('Auto pojištění – výročí', p.auto.vyroci && dOrDash(p.auto.vyroci));
  P('Počet majetkových smluv', p.majetek.pocet); P('Majetkové pojištění – výročí', p.majetek.vyroci && dOrDash(p.majetek.vyroci));
  [['edward', 'Investice Edward'], ['goldcoins', 'Goldcoins']].forEach(([k, l]) => {
    P(`${l} – počáteční vklad`, p[k].vklad ? kc(p[k].vklad) : ''); P(`${l} – měsíční platba`, p[k].mesicne ? kc(p[k].mesicne) : '');
    P(`${l} – výročí`, p[k].vyroci && dOrDash(p[k].vyroci)); P(`${l} – poznámka`, p[k].poznamka);
  });
  P('Počet doporučení', p.doporuceni.pocet); P('Schůzky z doporučení', p.doporuceni.schuzky); P('Doporučení – poznámka', p.doporuceni.poznamka);
  P('Připomínka výročí (dní předem)', c.pripominkaVyroci);
  P('Narozeniny', c.narozeniny.datum && dOrDash(c.narozeniny.datum)); P('Narozeniny – připomínka (dní předem)', c.narozeniny.dni);
  P('Svátek', c.svatek.datum && dOrDash(c.svatek.datum)); P('Svátek – název', c.svatek.nazev); P('Svátek – připomínka (dní předem)', c.svatek.dni);
  c.ostatniOsoby.forEach(o => {
    const n = `Osoba ${o.jmeno || '?'}${o.vztah ? ' (' + o.vztah + ')' : ''}`;
    P(`${n} – narozeniny`, o.narozeniny && dOrDash(o.narozeniny)); P(`${n} – svátek`, o.svatek && dOrDash(o.svatek)); P(`${n} – připomínka (dní předem)`, o.dni);
  });
  return f;
}
function diffClients(a, b) {
  const A = new Map(clientFields(a)), B = new Map(clientFields(b)), out = [];
  new Set([...A.keys(), ...B.keys()]).forEach(k => {
    const o = A.has(k) ? A.get(k) : '—', n = B.has(k) ? B.get(k) : '—';
    if (o !== n) out.push({ pole: k, staraHodnota: o, novaHodnota: n });
  });
  return out;
}
function addClientHistory(clientId, typZmeny, zmeny, snapshot) {
  const list = store.get(CL_KEYS.history, []) || [];
  list.unshift({ id: Date.now() + Math.random().toString(36).slice(2, 6), clientId, datumUpravy: new Date().toISOString(),
    typZmeny, zmeny, uzivatel: 'Uživatel', ...(snapshot ? { snapshot } : {}) });
  store.set(CL_KEYS.history, list.slice(0, CL_HISTORY_LIMIT));               // max 200, starší se zahodí
}
const historyOf = id => (store.get(CL_KEYS.history, []) || []).filter(h => h.clientId === id);

/* --- uložení / smazání / obnovení --- */
function saveClient(next, prev) {
  const now = new Date().toISOString();
  if (!prev) {
    next.id = uid(); next.datumVytvoreni = now; next.datumPosledniUpravy = now;
    clients.push(next);
    addClientHistory(next.id, 'vytvoreni', clientFields(next).filter(([, v]) => v !== '—' && v !== '0')
      .map(([pole, v]) => ({ pole, staraHodnota: '', novaHodnota: v })));
  } else {
    const zmeny = diffClients(prev, next);
    if (!zmeny.length) return false;
    next.datumPosledniUpravy = now;
    clients = clients.map(c => c.id === prev.id ? next : c);
    addClientHistory(next.id, 'uprava', zmeny);
  }
  saveClients(); resetClientNotified(next); updateClientBadge();
  return true;
}
function deleteClient(c) {
  addClientHistory(c.id, 'smazani', [{ pole: 'Klient', staraHodnota: clName(c), novaHodnota: '(smazán)' }], JSON.parse(JSON.stringify(c)));
  clients = clients.filter(x => x.id !== c.id); saveClients(); updateClientBadge();
}
function restoreClient(h) {
  if (!h.snapshot || clients.some(c => c.id === h.clientId)) return;
  const c = normalizeClient(h.snapshot); c.datumPosledniUpravy = new Date().toISOString();
  clients.push(c); saveClients();
  addClientHistory(c.id, 'vytvoreni', [{ pole: 'Obnovení', staraHodnota: '', novaHodnota: 'Klient obnoven ze smazaných' }]);
  updateClientBadge();
}

/* --- kalendář: připomínky klienta jako události --- */
function addClientToCalendar(c) {
  let added = 0;
  clientEvents(c).forEach(e => {
    if (events.some(x => x.clientId === c.id && x.reminderKey === e.key)) return;
    events.push({ id: uid(), title: `${eventTitle(e)} – ${clName(c)}`, date: e.ymd, start: '08:00', duration: 15,
      icon: e.ic, color: '#A8D5BA', reminderMinutes: e.dni > 0 ? e.dni * 1440 : null, notified: false,
      isClientReminder: true, clientId: c.id, reminderKey: e.key });
    added++;
  });
  if (added) saveEvents();
  infoToast(added ? `📅 Přidáno do kalendáře: ${added} ${plural(added, 'událost', 'události', 'událostí')}` : 'V kalendáři už všechno je.');
}

/* ---------- stránka: seznam klientů ---------- */
let clSort = 'abc', clQuery = '', clShowAllWarn = false;
/* --- export do kalendáře (.ics): každoročně opakované celodenní události ---
   Google / Apple / Outlook kalendář. Stejné UID při opakovaném exportu → aktualizace místo duplicit
   (Apple, Outlook; u Google kalendáře doporučujeme samostatný kalendář, viz nápověda v okně). */
const icsEsc = s => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
/** Zalomení řádku po 75 bajtech (RFC 5545), pokračování začíná mezerou. */
function icsFold(line) {
  const out = []; let cur = '', bytes = 0;
  for (const ch of line) {
    const b = te.encode(ch).length;
    if (bytes + b > 75) { out.push(cur); cur = ' ' + ch; bytes = 1 + b; } else { cur += ch; bytes += b; }
  }
  out.push(cur); return out.join('\r\n');
}
function icsEvents(opt) {
  const list = [], stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, ''), y = new Date().getFullYear();
  const dstr = x => ymd(x).replace(/-/g, '');
  const add = (uid, src, summary, desc, dni) => {
    if (!src || !/^\d{4}-\d{2}-\d{2}$/.test(src)) return;
    const [, m, d] = src.split('-').map(Number);
    const leap = m === 2 && d === 29;                                   // 29. 2. → poslední den února
    const start = new Date(y, m - 1, leap ? new Date(y, 2, 0).getDate() : d);
    const n = Number.isFinite(+dni) && +dni >= 0 ? Math.round(+dni) : 7;
    const trig = n === 0 ? 'PT9H' : `-PT${n * 24 - 9}H`;                // připomenutí v 9:00, n dní předem
    list.push(['BEGIN:VEVENT', `UID:${uid}@benefit-planner`, `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${dstr(start)}`, `DTEND;VALUE=DATE:${dstr(addDays(start, 1))}`,
      `RRULE:FREQ=YEARLY${leap ? ';BYMONTH=2;BYMONTHDAY=-1' : ''}`, `SUMMARY:${icsEsc(summary)}`,
      desc ? `DESCRIPTION:${icsEsc(desc)}` : null, 'TRANSP:TRANSPARENT',
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(summary)}`, `TRIGGER:${trig}`, 'END:VALARM', 'END:VEVENT'].filter(Boolean));
  };
  for (const c of clients) {
    const name = clName(c) || 'Klient';
    const contact = [c.telefon && 'Tel.: ' + c.telefon, c.email && 'E-mail: ' + c.email].filter(Boolean).join('\n');
    const born = c.narozeniny.datum || c.datumNarozeni;
    if (opt.bday) add(`${c.id}-narozeniny`, born, `🎂 ${name} – narozeniny${/^\d{4}/.test(born || '') ? ` (nar. ${born.slice(0, 4)})` : ''}`, contact, c.narozeniny.dni);
    if (opt.svatek) add(`${c.id}-svatek`, c.svatek.datum, `🎉 ${name} – svátek${c.svatek.nazev ? ` (${c.svatek.nazev})` : ''}`, contact, c.svatek.dni);
    if (opt.osoby) c.ostatniOsoby.forEach(o => {
      const who = [o.vztah, o.jmeno].filter(Boolean).join(' ') || 'blízká osoba', dni = o.dni ?? settings.clientRemindDefault;
      if (opt.bday) add(`${c.id}-${o.id}-narozeniny`, o.narozeniny, `🎂 ${who} (${name}) – narozeniny`, contact, dni);
      if (opt.svatek) add(`${c.id}-${o.id}-svatek`, o.svatek, `🎉 ${who} (${name}) – svátek`, contact, dni);
    });
    if (opt.vyroci) {
      const p = c.produkty;
      (p.zivotni.vyroci || []).forEach((d, i) => add(`${c.id}-vyroci-zivotni-${i}`, d, `💍 ${name} – výročí smlouvy (Životní pojištění)`, contact, c.pripominkaVyroci));
      [['auto', 'Auto pojištění'], ['majetek', 'Majetkové pojištění'], ['edward', 'Investice Edward'], ['goldcoins', 'Goldcoins']]
        .forEach(([k, l]) => add(`${c.id}-vyroci-${k}`, p[k].vyroci, `💍 ${name} – výročí smlouvy (${l})`, contact, c.pripominkaVyroci));
    }
  }
  return list;
}
function buildIcs(opt) {
  const ev = icsEvents(opt);
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Benefit Planner//CS', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    'X-WR-CALNAME:Klienti – narozeniny a svátky', 'X-WR-TIMEZONE:Europe/Prague', ...ev.flat(), 'END:VCALENDAR'];
  return { text: lines.map(icsFold).join('\r\n') + '\r\n', count: ev.length };
}
function openIcsModal() {
  $('#modalRoot').innerHTML = `
  <div class="modal-back" id="mBack"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="icsTitle">
    <header><h2 id="icsTitle">Do kalendáře</h2><button class="circle" id="icsX" aria-label="Zavřít">✕</button></header>
    <div class="modal-body">
      <p style="font-size:15px">Stáhne soubor <b>.ics</b> pro Google, Apple nebo Outlook kalendář. Události se opakují každý rok, připomenutí je nastavené podle počtu dní u klienta (v 9:00).</p>
      <div style="display:grid;gap:8px">
        <label class="check"><input type="checkbox" id="icsB" checked> 🎂 Narozeniny</label>
        <label class="check"><input type="checkbox" id="icsS" checked> 🎉 Svátky</label>
        <label class="check"><input type="checkbox" id="icsO" checked> 👨‍👩‍👧 Včetně blízkých osob klientů</label>
        <label class="check"><input type="checkbox" id="icsV"> 💍 Výročí smluv</label>
      </div>
      <p class="hint">Tip: importujte do samostatného kalendáře (např. „Klienti“). Po přidání nových klientů ho stačí smazat a naimportovat znovu – nevzniknou duplicity. Soubor obsahuje jména a telefony klientů, nikam ho neposílejte.</p>
      <p class="msg" id="icsMsg" aria-live="polite"></p>
    </div>
    <footer><span class="sp"></span><button class="btn" id="icsClose">Zavřít</button><button class="btn primary" id="icsGo">Stáhnout .ics</button></footer>
  </div></div>`;
  $('#icsX').onclick = $('#icsClose').onclick = closeModal;
  $('#mBack').addEventListener('mousedown', e => { if (e.target.id === 'mBack') closeModal(); });
  $('#icsGo').onclick = async () => {
    const msg = $('#icsMsg');
    const { text, count } = buildIcs({ bday: $('#icsB').checked, svatek: $('#icsS').checked, osoby: $('#icsO').checked, vyroci: $('#icsV').checked });
    if (!count) { msg.className = 'msg bad'; msg.textContent = 'Není co exportovat – u klientů chybí vyplněná data.'; return; }
    if (await saveFile(`benefit-klienti-kalendar-${todayYmd()}.ics`, text, 'text/calendar;charset=utf-8')) {
      msg.className = 'msg ok'; msg.textContent = `Staženo: ${count} ${plural(count, 'událost', 'události', 'událostí')}.`;
    }
  };
  modalKeyHandler = e => { if (e.key === 'Escape') closeModal(); };
  document.addEventListener('keydown', modalKeyHandler);
}
function renderKlienti() {
  const warns = clientWarnings();
  const deleted = (store.get(CL_KEYS.history, []) || []).filter(h => h.typZmeny === 'smazani' && h.snapshot && !clients.some(c => c.id === h.clientId));
  $('#view').innerHTML = `
  <div class="wrap">
    ${warns.length ? `<section class="cl-warn" aria-live="polite">
      <button class="cl-warn-x" id="clWarnX" aria-label="Zavřít upozornění" title="Zavřít">✕</button>
      <ul>${warns.slice(0, clShowAllWarn ? 999 : 5).map(e => `<li><button data-open="${e.clientId}">${e.ic} Blíží se ${e.label.charAt(0).toLowerCase() + e.label.slice(1)}: <b>${esc(e.clientName)}</b>${e.product ? ' – ' + esc(e.product) : ''} – ${czDateNum(e.ymd)} (${inDays(e.days)})</button></li>`).join('')}</ul>
      ${warns.length > 5 ? `<button class="cl-warn-more" id="clWarnMore">${clShowAllWarn ? 'Zobrazit méně' : `Zobrazit vše (${warns.length})`}</button>` : ''}
    </section>` : ''}
    <div class="cl-top">
      <label class="cl-search"><span aria-hidden="true">🔍</span><input type="search" id="clQ" placeholder="Hledat klienta (jméno, příjmení, telefon…)" value="${esc(clQuery)}" autocomplete="off"></label>
      <button class="btn" id="clIcs">📅 Do kalendáře</button>
      <button class="btn primary" id="clNew">+ Nový klient</button>
    </div>
    <div class="cl-sortrow"><div class="seg" role="group" aria-label="Řazení">
      <button data-sort="abc" aria-pressed="${clSort === 'abc'}">Abecedně</button>
      <button data-sort="next" aria-pressed="${clSort === 'next'}">Nejbližší výročí</button>
      <button data-sort="added" aria-pressed="${clSort === 'added'}">Datum přidání</button></div>
      <span class="muted" id="clCount"></span></div>
    <div id="clList" class="cl-list"></div>
    ${deleted.length ? `<details class="hitem cl-deleted"><summary><span><b>🗑️ Nedávno smazaní klienti (${deleted.length})</b><small>Lze obnovit z historie úprav</small></span><span class="chev" aria-hidden="true">›</span></summary>
      <ul class="warn-list" style="padding:0 16px 14px">${deleted.map(h => `<li><span><b>${esc(clName(h.snapshot))}</b><small>smazán ${fmtStamp(h.datumUpravy)}</small></span><button class="btn small" data-restore="${h.id}">Obnovit</button></li>`).join('')}</ul></details>` : ''}
  </div>`;

  const list = () => {
    const q = fold(clQuery.trim());
    let arr = clients.filter(c => !q || fold([c.jmeno, c.prijmeni, clName(c), c.telefon, c.telefon.replace(/\s/g, ''), c.email, c.adresa].join(' ')).includes(q));
    const nextDays = c => { const e = clientEvents(c); return e.length ? e[0].days : 1e9; };
    if (clSort === 'abc') arr.sort((a, b) => (a.prijmeni || '').localeCompare(b.prijmeni || '', 'cs') || (a.jmeno || '').localeCompare(b.jmeno || '', 'cs'));
    else if (clSort === 'next') arr.sort((a, b) => nextDays(a) - nextDays(b));
    else arr.sort((a, b) => (b.datumVytvoreni || '').localeCompare(a.datumVytvoreni || ''));
    $('#clCount').textContent = clients.length ? `${arr.length} z ${clients.length}` : '';
    $('#clList').innerHTML = !clients.length
      ? '<div class="card cl-empty"><span aria-hidden="true">👥</span><p>Zatím nemáte žádné klienty. Přidejte prvního klienta tlačítkem <b>+ Nový klient</b>.</p></div>'
      : !arr.length ? '<p class="empty">Nic nenalezeno.</p>'
      : arr.map(c => {
        const e = clientEvents(c)[0], n = productCount(c);
        return `<button class="cl-row" data-open="${c.id}">
          <span class="cl-ava" aria-hidden="true">${esc(((c.jmeno || '?')[0] + (c.prijmeni || '')[0] || '').toUpperCase())}</span>
          <span class="cl-main"><b>${esc(clName(c))}</b><small>${esc([c.telefon, c.email].filter(Boolean).join(' · ') || 'bez kontaktu')}</small></span>
          <span class="cl-meta">${n ? `<span class="pbadge" title="Počet produktů">${n} ${plural(n, 'produkt', 'produkty', 'produktů')}</span>` : ''}
            ${e ? `<small class="${e.days <= e.dni ? 'soon' : ''}">${e.ic} ${czDateShort(e.date)} · ${inDays(e.days)}</small>` : ''}</span>
        </button>`; }).join('');
  };
  list();
  $('#clQ').addEventListener('input', e => { clQuery = e.target.value; list(); });
  document.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { clSort = b.dataset.sort; renderKlienti(); });
  $('#clNew').onclick = () => openClientForm();
  $('#clIcs').onclick = openIcsModal;
  $('#view .wrap').addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (b) go('klient-' + b.dataset.open); });
  const x = $('#clWarnX'); if (x) x.onclick = () => {
    store.set(CL_KEYS.dismissed, [...new Set([...(store.get(CL_KEYS.dismissed, []) || []), ...warns.map(w => w.key)])]);
    renderKlienti(); updateClientBadge();
  };
  const more = $('#clWarnMore'); if (more) more.onclick = () => { clShowAllWarn = !clShowAllWarn; renderKlienti(); };
  document.querySelectorAll('[data-restore]').forEach(b => b.onclick = () => {
    const h = deleted.find(d => d.id === b.dataset.restore); if (!h) return;
    restoreClient(h); infoToast('♻️ Klient obnoven'); renderKlienti();
  });
  updateClientBadge();
}

/* ---------- stránka: detail klienta ---------- */

            ${h.typZmeny === 'vytvoreni' ? `<p class="t-sum">Klient byl vytvořen${h.zmeny.length ? ': ' + esc(h.zmeny.slice(0, 4).map(z => z.novaHodnota).join(', ')) + (h.zmeny.length > 4 ? '…' : '') : ''}</p>`
              : `<ul class="changes">${h.zmeny.map(z => `<li><span class="ch-f">${esc(z.pole)}:</span> <del>${esc(z.staraHodnota)}</del> <span aria-hidden="true">→</span> <ins>${esc(z.novaHodnota)}</ins></li>`).join('')}</ul>`}

  const rs = $('#rcShow'); if (rs) rs.onclick = () => { const v = $('#rcVal'), shown = rs.textContent === 'skrýt'; v.textContent = shown ? rcMasked : c.rodneCislo; rs.textContent = shown ? 'zobrazit' : 'skrýt'; };

  });
  const ex = $('#chExport'); if (ex) ex.onclick = async () => {
    const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
    const stamp = iso => { const d = new Date(iso); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
    const rows = hist.flatMap(h => (h.zmeny.length ? h.zmeny : [{ pole: '', staraHodnota: '', novaHodnota: '' }])

    const csv = '﻿' + ['Datum;Typ změny;Uživatel;Pole;Stará hodnota;Nová hodnota', ...rows].join('\r\n');
    if (await saveFile(`benefit-planner-historie-${slugify(clName(c)) || 'klient'}-${todayYmd()}.csv`, csv, 'text/csv;charset=utf-8')) infoToast('✅ Historie exportována');
  };
}

/* ---------- formulář klienta (modální okno) ---------- */
function openClientForm(prev) {
  closeModal();
  const c = normalizeClient(prev ? JSON.parse(JSON.stringify(prev)) : emptyClient());
  const p = c.produkty, v = x => x == null ? '' : esc(x);
  const num = (id, val, extra = '') => `<input type="number" min="0" inputmode="decimal" id="${id}" value="${val == null ? '' : val}" ${extra}>`;
  const personRow = o => `<div class="person" data-pid="${o.id}">
      <div class="row2"><label class="f">Jméno a příjmení<input type="text" data-k="jmeno" value="${v(o.jmeno)}" maxlength="80"></label>
        <label class="f">Vztah<input type="text" data-k="vztah" value="${v(o.vztah)}" placeholder="např. manželka, syn" maxlength="40"></label></div>
      <div class="row3"><label class="f">Narozeniny<input type="date" data-k="narozeniny" value="${v(o.narozeniny)}"></label>

/* =====================================================================
   15. VZDĚLÁVÁNÍ – agregátor finančních článků z RSS kanálů
   ---------------------------------------------------------------------
   JAK SE NAČÍTAJÍ ČLÁNKY
   Prohlížeč nesmí číst RSS z cizích webů přímo (CORS). Proto:
     1) EDU_BACKEND_URL – vlastní backend (doporučeno pro ostrý provoz). Např. Node.js + Express + rss-parser,
        endpoint vrací surové XML kanálu: GET {EDU_BACKEND_URL}?url=<adresa kanálu>. Vyžaduje samostatný server
        (Vercel, Railway…) – není součástí této aplikace. Prázdné = nepoužívá se.
     2) Veřejné CORS proxy (výchozí, bez backendu). POZOR: mají limity rychlosti a výpadky, nic negarantují
        a vidí, které kanály se načítají (žádná osobní data se neposílají). Zkouší se postupně.
   V online náhledu (claude.ai) prohlížeč spojení na cizí servery blokuje úplně – články se načtou
   jen ve staženém souboru nebo na vlastním hostingu (GitHub Pages).

   ZDROJE lze kdykoli upravit – v aplikaci (Vzdělávání → Zdroje článků) nebo zde v EDU_DEFAULT_SOURCES.
   localStorage: vzdelavaniCache → { timestamp, articles } (platnost 1 hodina)
                 vzdelavaniSettings → { aktivniTema, zdroje }
   ===================================================================== */
const EDU_CACHE_KEY = 'vzdelavaniCache', EDU_SET_KEY = 'vzdelavaniSettings';
const EDU_TTL = 60 * 60 * 1000, EDU_PAGE = 20, EDU_TIMEOUT = 12000, EDU_MAX_ARTICLES = 200;
const EDU_BACKEND_URL = '';   // ← sem případně adresu vlastního backendu
const EDU_PROXIES = [
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
];
/* Stav ověření ke dni 15. 11. 2026:
   - Finance.cz /rss/clanky/ – ověřeno (platný RSS 2.0). Adresa ze zadání /rss/ je jen rozcestník.
   - MF ČR – adresa ze zadání přesměrovává na rozcestník mf.gov.cz/cs/rss; použit kanál tiskových zpráv.
   - Měšec.cz, Finance.cz aktuality, MF – adresy převzaté z webů, obsah se nepodařilo ověřit.
   - Kurzy.cz – adresu ze zadání nešlo ověřit (web automatické čtení zakazuje) → výchozí vypnuto.
   - ČNB – adresa ze zadání (cnb.cz/cs/rss/) vrací chybu; funkční RSS kanál ČNB se nepodařilo najít. */
const EDU_DEFAULT_SOURCES = [
  { id: 'finance-clanky', name: 'Finance.cz', url: 'https://www.finance.cz/rss/clanky/', site: 'https://www.finance.cz/', on: true },
  { id: 'finance-aktuality', name: 'Finance.cz – aktuality', url: 'https://www.finance.cz/rss/aktuality/', site: 'https://www.finance.cz/', on: true },
  { id: 'mesec', name: 'Měšec.cz', url: 'https://www.mesec.cz/rss/', site: 'https://www.mesec.cz/', on: true },
  { id: 'mf-tz', name: 'Ministerstvo financí ČR', url: 'https://mf.gov.cz/cs/rss/tiskove-zpravy-rss', site: 'https://mf.gov.cz/', on: true },
  { id: 'kurzy', name: 'Kurzy.cz', url: 'https://www.kurzy.cz/zpravy/util/forext.dat?type=rss', site: 'https://www.kurzy.cz/', on: false },
];
const EDU_LINKS = [ { name: 'ČNB – tiskové zprávy', url: 'https://www.cnb.cz/cs/cnb-news/tiskove-zpravy/' } ];
/* Témata – zařazení podle klíčových slov v názvu a perexu (bez diakritiky, od začátku slova). */
const EDU_TOPICS = [
  { k: 'vse', ic: '📊', label: 'Vše' },
  { k: 'inflace', ic: '📈', label: 'Inflace', re: /(^|[^a-z0-9])(inflac|spotrebitelsk\w* cen|ceny|cen energi|csu)/ },
  { k: 'investice', ic: '💰', label: 'Investice', re: /(^|[^a-z0-9])(investic|investov|akcie|akcii|akciov|fond|vynos|portfoli|dluhopis|etf)/ },
  { k: 'uvery', ic: '🏦', label: 'Úvěry', re: /(^|[^a-z0-9])(uver|hypote|pujck|splat|rpsn|refinanc)/ },
  { k: 'pojisteni', ic: '🛡️', label: 'Pojištění', re: /(^|[^a-z0-9])(pojist|skod[auy]|plneni)|(^|[^a-z0-9])pov([^a-z0-9]|$)/ },
];

function loadEdu() {
  const e = Object.assign({ aktivniTema: 'vse', zdroje: null }, store.get(EDU_SET_KEY, {}));
  if (!Array.isArray(e.zdroje) || !e.zdroje.length) e.zdroje = EDU_DEFAULT_SOURCES.map(s => ({ ...s }));
  return e;
}
let eduSettings = loadEdu();
const saveEduSettings = () => store.set(EDU_SET_KEY, eduSettings);
let eduState = { loading: false, articles: null, errors: [], shown: EDU_PAGE, timestamp: 0, fatal: false };

/* --- načtení jednoho kanálu --- */
function withTimeout(url, ms) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  return fetch(url, { signal: ctl.signal, cache: 'no-store' }).finally(() => clearTimeout(t));
}
/** Dekóduje XML se správným kódováním (některé české weby používají windows-1250). */
function decodeXml(buf) {
  const head = new TextDecoder('ascii').decode(buf.slice(0, 200));
  const m = /encoding=["']([\w-]+)["']/i.exec(head);
  let enc = (m ? m[1] : 'utf-8').toLowerCase();
  try { return new TextDecoder(enc).decode(buf); } catch (e) { return new TextDecoder('utf-8').decode(buf); }
}
async function fetchFeedXml(url) {
  const tries = [];
  if (EDU_BACKEND_URL) tries.push(EDU_BACKEND_URL + (EDU_BACKEND_URL.includes('?') ? '&' : '?') + 'url=' + encodeURIComponent(url));
  EDU_PROXIES.forEach(p => tries.push(p(url)));
  let lastErr;
  for (const u of tries) {
    try {
      const res = await withTimeout(u, EDU_TIMEOUT);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = decodeXml(await res.arrayBuffer());
      if (!/<(rss|feed|rdf:RDF)[\s>]/i.test(text)) throw new Error('není RSS');
      return text;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('nedostupné');
}
const htmlToText = html => {
  if (!html) return '';
  const doc = new DOMParser().parseFromString(String(html).replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|li|h\d)>/gi, '\n\n'), 'text/html');
  return (doc.body.textContent || '').replace(/[ \t]+/g, ' ').replace(/\n\s*\n\s*\n+/g, '\n\n').trim();
};
/** RSS 2.0 / RSS 1.0 (RDF) / Atom → články */
function parseFeed(xmlText, src) {
  const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
  if (xml.querySelector('parsererror')) throw new Error('neplatné XML');
  const items = [...xml.getElementsByTagName('item'), ...xml.getElementsByTagName('entry')];
  const tx = (el, ...names) => { for (const n of names) { const x = el.getElementsByTagName(n)[0]; if (x && x.textContent.trim()) return x.textContent.trim(); } return ''; };
  return items.map(it => {
    const linkEl = it.getElementsByTagName('link')[0];
    const link = (linkEl && (linkEl.getAttribute('href') || linkEl.textContent) || '').trim();
    const enc = it.getElementsByTagNameNS('*', 'encoded')[0];
    const dateStr = tx(it, 'pubDate', 'published', 'updated', 'dc:date');
    const d = dateStr ? new Date(dateStr) : null;
    const desc = htmlToText(tx(it, 'description', 'summary'));
    const content = enc ? htmlToText(enc.textContent).slice(0, 6000) : '';
    const title = htmlToText(tx(it, 'title'));
    const hay = fold(title + ' ' + desc);
    const topics = EDU_TOPICS.filter(t => t.re && t.re.test(hay)).map(t => t.k);
    return { id: src.id + '|' + (link || title), title, link: /^https?:\/\//i.test(link) ? link : '', source: src.name, sourceId: src.id,
      date: d && !isNaN(d) ? d.toISOString() : '', perex: desc.slice(0, 600), content, topics };
  }).filter(a => a.title);
}
/** Načte všechny zapnuté zdroje (paralelně). Nedostupné zdroje se přeskočí. */
async function loadArticles(force) {
  const cache = store.get(EDU_CACHE_KEY, null);
  if (!force && cache && Date.now() - cache.timestamp < EDU_TTL && Array.isArray(cache.articles) && cache.articles.length) {
    eduState = { ...eduState, articles: cache.articles, errors: cache.errors || [], timestamp: cache.timestamp, fatal: false };
    return;
  }
  const active = eduSettings.zdroje.filter(s => s.on);
  const results = await Promise.allSettled(active.map(async s => parseFeed(await fetchFeedXml(s.url), s)));
  const articles = [], errors = [];
  results.forEach((r, i) => r.status === 'fulfilled' ? articles.push(...r.value) : errors.push(active[i].name));
  const seen = new Set();
  const uniq = articles.filter(a => { const k = a.link || a.title; if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, EDU_MAX_ARTICLES);
  if (!uniq.length) { eduState = { ...eduState, articles: cache?.articles || null, errors, fatal: true, timestamp: cache?.timestamp || 0 }; return; }
  const timestamp = Date.now();
  store.set(EDU_CACHE_KEY, { timestamp, articles: uniq, errors });
  eduState = { ...eduState, articles: uniq, errors, timestamp, fatal: false };
}

const relDate = iso => {
  if (!iso) return '';
  const d = new Date(iso), days = Math.floor((parseYmd(todayYmd()) - parseYmd(ymd(d))) / 864e5);
  if (days <= 0) { const h = Math.floor((Date.now() - d) / 36e5); return h < 1 ? 'před chvílí' : `před ${h} ${plural(h, 'hodinou', 'hodinami', 'hodinami')}`; }
  if (days === 1) return 'včera';
  if (days < 7) return `před ${days} dny`;
  return `${d.getDate()}. ${d.getMonth() + 1}. ${d.getFullYear()}`;
};
const ago = ts => { const m = Math.round((Date.now() - ts) / 6e4); return m < 1 ? 'právě teď' : m < 60 ? `před ${m} min` : `před ${Math.round(m / 60)} h`; };
const topicOf = a => EDU_TOPICS.find(t => a.topics.includes(t.k));

/* --- stránka --- */
function renderVzdelavani() {
  const t = eduSettings.aktivniTema;
  $('#view').innerHTML = `
  <div class="wrap">
    <div class="edu-top">
      <div class="edu-pills" role="tablist" aria-label="Témata">
        ${EDU_TOPICS.map(x => `<button role="tab" data-topic="${x.k}" aria-selected="${x.k === t}" class="edu-pill${x.k === t ? ' on' : ''}">${x.ic} ${x.label}</button>`).join('')}
      </div>
      <div class="edu-actions"><span class="muted" id="eduStamp"></span><button class="btn small" id="eduRefresh">🔄 Obnovit</button></div>
    </div>
    <div id="eduBody" aria-live="polite"></div>
    <details class="hitem edu-src"><summary><span><b>⚙️ Zdroje článků</b><small>Zapnout, vypnout nebo přidat vlastní RSS kanál</small></span><span class="chev" aria-hidden="true">›</span></summary>
      <div class="edu-src-body">
        <ul class="edu-src-list">${eduSettings.zdroje.map((s, i) => `<li>
          <label class="switch"><span><b>${esc(s.name)}</b><small>${esc(s.url)}</small></span><input type="checkbox" data-src="${i}"${s.on ? ' checked' : ''}><span class="tr" aria-hidden="true"></span></label>
          ${EDU_DEFAULT_SOURCES.some(d => d.id === s.id) ? '' : `<button class="btn small danger" data-srcdel="${i}">Odebrat</button>`}</li>`).join('')}</ul>
        <form class="edu-add" id="eduAdd" novalidate>
          <input type="text" id="eduAddName" placeholder="Název zdroje" maxlength="60">
          <input type="text" id="eduAddUrl" placeholder="https://…/rss" maxlength="300" inputmode="url">
          <button class="btn small primary">+ Přidat zdroj</button>
        </form>
        <p class="err" id="eduAddErr" hidden></p>
        <div class="btn-row"><button class="btn small" id="eduSrcReset">Obnovit výchozí zdroje</button></div>
      </div>
    </details>
  </div>`;

  document.querySelectorAll('[data-topic]').forEach(b => b.onclick = () => {
    eduSettings.aktivniTema = b.dataset.topic; saveEduSettings(); eduState.shown = EDU_PAGE;
    document.querySelectorAll('[data-topic]').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-selected', String(on)); });
    drawEdu();
  });
  $('#eduRefresh').onclick = () => fetchAndDraw(true);
  document.querySelectorAll('[data-src]').forEach(c => c.onchange = () => { eduSettings.zdroje[+c.dataset.src].on = c.checked; saveEduSettings(); store.set(EDU_CACHE_KEY, null); });
  document.querySelectorAll('[data-srcdel]').forEach(b => armConfirm(b, 'Opravdu?', () => { eduSettings.zdroje.splice(+b.dataset.srcdel, 1); saveEduSettings(); store.set(EDU_CACHE_KEY, null); renderVzdelavani(); }));
  $('#eduAdd').onsubmit = e => {
    e.preventDefault();
    const name = $('#eduAddName').value.trim(), url = $('#eduAddUrl').value.trim(), err = $('#eduAddErr');
    if (!name || !/^https?:\/\/\S+\.\S+/i.test(url)) { err.textContent = 'Vyplňte název a platnou adresu začínající https://'; err.hidden = false; return; }
    eduSettings.zdroje.push({ id: 'vlastni-' + uid(), name, url, site: url, on: true }); saveEduSettings(); store.set(EDU_CACHE_KEY, null);
    renderVzdelavani(); fetchAndDraw(true);
  };
  armConfirm($('#eduSrcReset'), 'Opravdu?', () => { eduSettings.zdroje = EDU_DEFAULT_SOURCES.map(s => ({ ...s })); saveEduSettings(); store.set(EDU_CACHE_KEY, null); renderVzdelavani(); });

  if (eduState.articles && Date.now() - eduState.timestamp < EDU_TTL) drawEdu(); else fetchAndDraw(false);
}
async function fetchAndDraw(force) {
  if (eduState.loading) return;
  eduState.loading = true; eduState.shown = EDU_PAGE; drawEdu();
  try { await loadArticles(force); } finally { eduState.loading = false; }
  if ($('#eduBody')) drawEdu();
}
function drawEdu() {
  const body = $('#eduBody'); if (!body) return;
  $('#eduRefresh').disabled = eduState.loading;
  $('#eduStamp').textContent = eduState.loading ? 'Načítám…' : eduState.timestamp ? 'Aktualizováno ' + ago(eduState.timestamp) : '';
  if (eduState.loading) {
    body.innerHTML = `<div class="edu-grid">${Array.from({ length: 6 }, () => '<div class="edu-card skel"><i></i><i></i><i></i><i class="short"></i></div>').join('')}</div>`;
    return;
  }
  const all = eduState.articles || [];
  if (!eduSettings.zdroje.some(s => s.on)) {
    body.innerHTML = '<div class="card edu-empty"><span aria-hidden="true">🔌</span><p><b>Nemáte zapnutý žádný zdroj článků.</b> Zapněte ho v sekci „Zdroje článků“ níže.</p></div>';
    return;
  }
  if (eduState.fatal && !all.length) {
    let framed = true; try { framed = window.self !== window.top; } catch (e) { /* cizí rámec */ }
    body.innerHTML = `<div class="card edu-empty">
      <span aria-hidden="true">📡</span>
      <p><b>Články se nepodařilo načíst.</b> Zkontrolujte připojení k internetu nebo to zkuste později.</p>
      ${framed ? '<p class="hint">V online náhledu aplikace prohlížeč načítání článků z cizích webů blokuje. Články se načtou ve staženém souboru aplikace nebo po nahrání na vlastní web (GitHub Pages).</p>' : ''}
      <button class="btn primary" id="eduRetry">🔄 Zkusit znovu</button>
      <div class="edu-links"><p class="hint">Mezitím můžete číst přímo na webech zdrojů:</p>
        ${[...eduSettings.zdroje.filter(s => s.on && s.site).filter((s, i, a) => a.findIndex(x => x.site === s.site) === i).map(s => ({ name: s.name.replace(/ – .*/, ''), url: s.site })), ...EDU_LINKS]
          .map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.name)} ↗</a>`).join('')}</div>
    </div>`;
    $('#eduRetry').onclick = () => fetchAndDraw(true);
    return;
  }
  const t = eduSettings.aktivniTema;
  const list = t === 'vse' ? all : all.filter(a => a.topics.includes(t));
  const shown = list.slice(0, eduState.shown);
  body.innerHTML = `
    ${eduState.errors.length ? `<p class="edu-warn">⚠️ Nepodařilo se načíst: ${esc(eduState.errors.join(', '))}. Zobrazuji články z ostatních zdrojů.</p>` : ''}
    ${eduState.fatal ? '<p class="edu-warn">⚠️ Obnovení se nepodařilo – zobrazuji naposledy uložené články.</p>' : ''}
    ${shown.length ? `<div class="edu-grid">${shown.map((a, i) => {
      const tp = topicOf(a);
      return `<article class="edu-card fade" style="--tc:var(--topic-${tp ? tp.k : 'vse'});animation-delay:${Math.min(i, 10) * 30}ms" data-art="${i}" tabindex="0">
        <div class="edu-meta">${tp ? `<span class="edu-chip">${tp.ic} ${tp.label}</span>` : ''}<span>${esc(a.source)}${a.date ? ' · ' + relDate(a.date) : ''}</span></div>
        <h3>${esc(a.title)}</h3>
        ${a.perex ? `<p>${esc(a.perex)}</p>` : ''}
        ${a.link ? `<a class="edu-read" href="${esc(a.link)}" target="_blank" rel="noopener noreferrer">Číst celý článek →</a>` : ''}
      </article>`; }).join('')}</div>`
      : `<div class="card edu-empty"><span aria-hidden="true">🔎</span><p>V tématu „${EDU_TOPICS.find(x => x.k === t).label}“ teď nejsou žádné články.</p></div>`}
    ${list.length > shown.length ? `<div class="edu-more"><button class="btn" id="eduMore">Načíst další (${list.length - shown.length})</button></div>` : ''}`;
  const more = $('#eduMore'); if (more) more.onclick = () => { eduState.shown += EDU_PAGE; drawEdu(); };
  body.querySelectorAll('[data-art]').forEach(card => {
    const open = e => { if (e.target.closest('a')) return; openArticle(shown[+card.dataset.art]); };
    card.onclick = open;
    card.onkeydown = e => { if (e.key === 'Enter') open(e); };
  });
}
function openArticle(a) {
  closeModal();
  const tp = topicOf(a);
  const text = a.content || a.perex || '';
  $('#modalRoot').innerHTML = `
  <div class="modal-back" id="mBack"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="artTitle">
    <header><h2 id="artTitle" class="art-title">${esc(a.title)}</h2><button class="circle" id="artX" aria-label="Zavřít">✕</button></header>
    <div class="modal-body">
      <div class="edu-meta">${tp ? `<span class="edu-chip" style="--tc:var(--topic-${tp.k})">${tp.ic} ${tp.label}</span>` : ''}<span>${esc(a.source)}${a.date ? ' · ' + relDate(a.date) : ''}</span></div>
      <div class="art-text">${text ? text.split(/\n{2,}/).map(p => `<p>${esc(p)}</p>`).join('') : '<p class="muted">Zdroj neposkytuje text článku – otevřete ho na webu.</p>'}</div>
      ${!a.content ? '<p class="hint">Zdroj v RSS posílá jen perex. Celý článek najdete na webu.</p>' : ''}
    </div>
    <footer><span class="sp"></span>
      ${a.link ? `<a class="btn primary" href="${esc(a.link)}" target="_blank" rel="noopener noreferrer">Otevřít v nové kartě ↗</a>` : ''}
      <button class="btn" id="artClose">Zavřít</button></footer>
  </div></div>`;
  $('#artX').onclick = $('#artClose').onclick = closeModal;
  $('#mBack').addEventListener('mousedown', e => { if (e.target.id === 'mBack') closeModal(); });
  modalKeyHandler = e => { if (e.key === 'Escape') closeModal(); };
  document.addEventListener('keydown', modalKeyHandler);
}

function tkAge(ymdStr) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(ymdStr || '')) return null;
  const [y, m, d] = ymdStr.split('-').map(Number), t = new Date();
  let a = t.getFullYear() - y; if (t.getMonth() + 1 < m || (t.getMonth() + 1 === m && t.getDate() < d)) a--;
  return a >= 0 && a < 130 ? a : null;
}

  if (!t.barvy || typeof t.barvy !== 'object' || Array.isArray(t.barvy)) t.barvy = {};

}

/** Rozdělení osob na strany A4 (na šířku): s patičkou se vejdou 4 osoby, bez ní 5. */
function tkPages(n) {
  const pages = []; let i = 0;
  while (n - i > 4) { const take = n - i === 5 ? 4 : 5; pages.push([i, i + take]); i += take; }
  pages.push([i, n]); return pages;
}
function tkSheetHTML(t, mode, from = 0, to = t.osoby.length, foot = true) {
