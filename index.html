/* Benefit Planner – osobní plánovač poradkyně
   VOICE: čistý, klidný, profesionální
   IDEA: zelený diář – bílé karty, tmavě zelené akcenty, světle zelené plochy
   PICTURE: bannery se zelenými listy a logem Benefit, kapslové dny, karty plánu v barvách činností
   COLOUR and TYPE: paleta níže v :root (zelená / černo-šedá / bílá); Outfit
   LAYOUT: hlavička s logem, obsah v kartách, plovoucí bílá kapsle navigace

   ▼▼ VŠECHNY BARVY APLIKACE SE MĚNÍ JEN TADY (CSS proměnné v :root) ▼▼
   Výjimka: barvy jednotlivých činností – volí je uživatel, ukládají se k činnosti. */

/* ===== 1. PALETA A PROMĚNNÉ ===== */
:root{
  color-scheme:light;
  /* --- základní paleta --- */
  --color-primary:#2F5D3A;        /* tmavě zelená – hlavní akcent */
  --color-primary-dark:#244A2E;   /* tmavší pro hover */
  --color-secondary:#6BAF85;      /* střední zelená – sekundární akcent */
  --color-accent:#A8D5BA;         /* světle zelená */
  --color-accent-soft:#E8F5EE;    /* velmi světlá zelená */
  --color-text:#2B2B2B;           /* černo-šedá */
  --color-text-muted:#707070;     /* střední šedá – ztmaveno z #8A8A8A kvůli čitelnosti (kontrast 4,9 : 1 na bílé) */
  --color-bg:#FFFFFF;             /* bílá */
  --color-bg-soft:#F5F5F5;        /* světlá šedá */
  --color-border:#E0E0E0;         /* jemné linky */
  --color-black:#2B2B2B;          /* pevná černo-šedá (nemění se s režimem) */
  --color-white:#FFFFFF;          /* pevná bílá (nemění se s režimem) */
  --color-error:#B3261E;          /* jediný akcent mimo paletu – POUZE chybové hlášky */
  --color-neon:#B8F2C9;           /* jemně neonová světle zelená – bannery „Dnešní plán“ a hodiny */
  --color-status-low:#E07A5F;     /* plnění cíle < 50 % (jemně oranžovo-červená) */
  --color-status-mid:#E9B44C;     /* plnění cíle 50–99 % (jemně oranžovo-žlutá) */
  --color-bar-bg:#E0E0E0;         /* pozadí progress barů */
  --paper:#FFFFFF; --paper-ink:#000000;
  --warn-bg:#FFF4E0; --warn-ink:#9C5D00;   /* upozornění na klienty – text ztmaven z #B86E00 kvůli čitelnosti (4,8 : 1) */
  /* barevné pruhy témat ve Vzdělávání (jemné odstíny; modrou a fialovou lze nahradit zelenou) */
  --topic-inflace:#E9A23B; --topic-investice:#6BAF85; --topic-uvery:#7C9CBF; --topic-pojisteni:#9C8AC9; --topic-vse:#A8D5BA;   /* papír dokumentu (náhled A4, tisk) – stejný ve světlém i tmavém režimu */

  /* --- role (odkazují na paletu) --- */
  --page:var(--color-bg);                 /* pozadí stránek */
  --surface:var(--color-bg);              /* karty, modály */
  --surface-soft:var(--color-bg-soft);
  --lock-bg:var(--color-accent-soft);     /* pozadí zamykací obrazovky */
  --ink:var(--color-text);
  --muted:var(--color-text-muted);
  --line:var(--color-border);
  --brand-ink:var(--color-primary);       /* zelený text a ikony */
  --on-primary:var(--color-white);
  --hover:var(--color-accent-soft);
  --today-bg:var(--color-accent-soft);
  --sum-dark:var(--color-black);
  --glass:rgba(255,255,255,.62);          /* podklad štítků na barevných kartách */
  --overlay:rgba(43,43,43,.42);
  --shadow-soft:0 6px 24px -12px rgba(43,43,43,.22);
  --shadow:0 18px 40px -18px rgba(43,43,43,.30);
  --shadow-banner:0 16px 32px -16px rgba(47,93,58,.55);
  --shade-12:rgba(43,43,43,.12); --shade-20:rgba(43,43,43,.2); --shade-25:rgba(43,43,43,.25);   /* průhledná černo-šedá pro jemné obrysy */


  /* --- tvary, písmo, pohyb --- */
  --r-lg:18px; --r-md:14px;
  --ease:.25s ease;
  --font:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
/* Tmavý režim – stejná paleta, jen tmavší odstíny černo-šedé */
:root[data-app-theme=dark]{
  color-scheme:dark;
  --color-text:#FFFFFF;
  --color-text-muted:#A3A3A3;
  --color-bg:#2B2B2B;
  --color-bg-soft:#363636;
  --color-border:#444444;
  --page:#1F1F1F;
  --lock-bg:#1F2A23;
  --brand-ink:var(--color-accent);
  --hover:#33433A;
  --today-bg:#33433A;
  --sum-dark:#3A3A3A;
  --color-error:#F2B8B5;
  --warn-bg:#3A2E1A; --warn-ink:#F2C27A;
  --shadow-soft:0 6px 24px -12px rgba(0,0,0,.6);
  --shadow:0 18px 40px -18px rgba(0,0,0,.7);
}

/* ===== 2. ZÁKLAD ===== */
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.45 var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,a,input,select,textarea{transition:background-color var(--ease),border-color var(--ease),color var(--ease),box-shadow var(--ease),filter var(--ease)}
h1,h2,h3{margin:0;line-height:1.08;font-weight:500;text-wrap:balance}
p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--color-secondary);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}

/* ===== 3. TLAČÍTKA, POLE ===== */
.btn{min-height:48px;padding:0 22px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--hover);border-color:var(--color-accent)}
.btn.primary{background:var(--color-primary);border-color:var(--color-primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--color-primary-dark);border-color:var(--color-primary-dark)}
.btn.danger{color:var(--ink);border-color:var(--line)}            /* mazání – neutrální, bez červené */
.btn.danger:hover{background:var(--color-black);border-color:var(--color-black);color:var(--color-white)}
.btn.small{min-height:40px;padding:0 16px;font-size:15px}
.circle{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--brand-ink);display:inline-grid;place-items:center;position:relative;flex:none;font-size:20px}
.circle:hover{background:var(--hover);border-color:var(--color-accent)}
.circle svg{width:22px;height:22px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],input[type=tel],input[type=email],select,textarea{
  width:100%;min-height:52px;padding:12px 16px;border:1.5px solid var(--line);border-radius:var(--r-md);background:var(--surface);font-size:16px}
textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--color-primary);box-shadow:0 0 0 3px var(--hover)}
label.f{display:grid;gap:6px;font-weight:500;font-size:15px}
.err{color:var(--color-error);font-size:14px}
.muted{color:var(--muted)}

/* ===== 4. BANNERY (HERO) ===== */
/* „Dnešní plán“ (Menu) a hodiny (Kalendář): section.hero.brand / section.hero.clock.brand – vzhled viz „Banner…“ níže */
.hero{position:relative;overflow:hidden;background:var(--color-black);color:var(--color-white);border-radius:16px;padding:24px 22px;min-height:178px;display:flex;align-items:center}
.hero-txt{position:relative;z-index:1;max-width:62%}
.hero h2{font-size:clamp(34px,9vw,46px);font-weight:700;letter-spacing:-.02em;line-height:.98}
.hero p{margin-top:8px;font-size:15px;font-weight:600}
.faces{display:flex;margin-top:14px}
.face{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--c,var(--color-white));border:2.5px solid var(--color-primary);margin-right:-10px;overflow:hidden}
.face img{width:100%;height:100%;object-fit:cover}
.face.more{background:var(--color-accent);color:var(--color-black);font-size:14px;font-weight:600}

.hero.brand::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.38),rgba(0,0,0,.12) 50%,rgba(0,0,0,0));pointer-events:none}
.hero.brand h2{color:var(--color-white);text-shadow:0 2px 10px rgba(0,0,0,.5)}
.hero.brand p{color:var(--color-white);opacity:.92;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.hero.brand .face{border-color:var(--color-black)}
.hero.brand .clock-t{text-shadow:0 2px 10px rgba(0,0,0,.55);font-size:clamp(30px,9vw,64px)}
.hero.brand .clock-d{text-shadow:0 1px 6px rgba(0,0,0,.6)}
.hero.brand .face.more{background:var(--color-accent);color:var(--color-black)}
.hero-logo{position:absolute;right:clamp(8px,3vw,24px);top:50%;transform:translateY(-50%);width:min(40%,170px);height:auto;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5));pointer-events:none}

/* ===== 5. ZAMYKACÍ OBRAZOVKA ===== */
.lock{position:fixed;inset:0;z-index:100;background:var(--lock-bg);overflow:auto;transition:opacity .3s ease,transform .3s ease}
.lock.out{opacity:0;transform:scale(1.02);pointer-events:none}
/* Rozložení shora dolů: banner → „Zadejte PIN“ → tečky → klávesnice.
   Velikosti se zmenšují podle výšky displeje (vh), aby se vše vešlo i na menší telefon. */
.lock-inner{--k:clamp(56px,7.8vh,74px);width:min(420px,100%);min-height:100%;margin:0 auto;padding:clamp(16px,3vh,36px) 20px 28px;display:grid;gap:clamp(8px,1.5vh,14px);justify-items:center;align-content:center}
.lock-banner{display:block;width:100%;max-width:100%;height:auto;margin:0 auto clamp(10px,2vh,20px);border-radius:16px;box-shadow:var(--shadow-banner)}
.lock h3{font-size:clamp(20px,2.8vh,24px);font-weight:500;color:var(--ink)}
.dots{display:flex;gap:18px;height:18px}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--line);transition:background-color .15s ease,transform .15s ease}
.dots i.on{background:var(--color-primary);transform:scale(1.1)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pin-err{min-height:22px;color:var(--color-error);font-weight:500}
.keypad{display:grid;grid-template-columns:repeat(3,var(--k));gap:clamp(8px,1.4vh,16px) 22px}
.keypad button{height:var(--k);border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:28px;font-weight:400;box-shadow:var(--shadow-soft)}
.keypad button:hover{background:var(--hover);border-color:var(--color-accent)}
.keypad button:active{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-black)}
.keypad .blank{visibility:hidden}
.lock-sub{margin-top:-4px;color:var(--ink);font-size:15px;text-align:center;max-width:340px;min-height:1px}
.lock-link{background:none;border:0;color:var(--brand-ink);font-size:15px;font-weight:500;text-decoration:underline;text-underline-offset:3px;padding:10px;cursor:pointer}
.lock-panel{width:100%}
.rescue{display:grid;gap:14px;text-align:left}
.rescue p{font-size:15px;color:var(--ink);line-height:1.5}
.rescue-code{display:block;padding:16px 12px;border-radius:var(--r-md);background:var(--today-bg);color:var(--brand-ink);border:1.5px dashed var(--color-secondary);font:500 clamp(22px,6vw,28px)/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;text-align:center;user-select:all;word-break:break-all}
.rescue .btn-row{justify-content:center}
.rescue .f input{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase}
.keypad .del{border-color:transparent;background:transparent;box-shadow:none;font-size:24px;color:var(--brand-ink)}

/* ===== 6. LAYOUT + PLOVOUCÍ NAVIGACE ===== */
.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:14px 20px 10px;max-width:1100px;width:100%;margin:0 auto}
.ava{display:block;width:52px;height:52px;border-radius:50%;object-fit:cover;box-shadow:var(--shadow-soft)}
.hd{text-align:center}
.hd h1{font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd p{font-size:15px;color:var(--muted);white-space:nowrap}
.top-actions{display:flex;gap:8px;justify-content:flex-end}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--color-primary);color:var(--on-primary);font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--page)}
main{overflow-y:auto;overflow-x:hidden;padding-bottom:130px}
.nav{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(660px,calc(100% - 12px));height:66px;border-radius:40px;background:var(--surface);border:1px solid var(--line);display:grid;grid-template-columns:repeat(9,1fr);align-items:center;justify-items:center;padding:0 4px;box-shadow:var(--shadow)}
.nav a{width:clamp(34px,9.6vw,52px);height:clamp(34px,9.6vw,52px);border-radius:50%;display:grid;place-items:center;color:var(--brand-ink)}
.nav a svg{width:22px;height:22px}
.nav a.active{background:var(--color-primary);color:var(--on-primary)}
.nav a:not(.active):hover{background:var(--hover)}
.fab{position:fixed;z-index:25;right:20px;bottom:calc(104px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;border:0;background:var(--color-primary);color:var(--on-primary);font-size:32px;font-weight:300;box-shadow:var(--shadow);display:grid;place-items:center}
.fab:hover{background:var(--color-primary-dark)}
@media(min-width:900px){.fab{right:max(24px,calc((100vw - 1100px)/2 + 20px))}}
.sec{font-size:clamp(26px,6.5vw,32px);font-weight:500;letter-spacing:-.01em;margin:32px 0 14px}
.card{background:var(--surface);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-soft);border:1px solid var(--line)}
.empty{color:var(--muted);font-size:15px}

/* ===== 7. KAPSLE DNŮ (týdenní pás) ===== */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-top:18px}
.pill{height:80px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);display:grid;grid-template-rows:12px auto auto;justify-items:center;align-content:center;gap:2px;padding:0}
.pill i{width:6px;height:6px;border-radius:50%;background:transparent}
.pill i.has{background:var(--color-secondary)}
.pill span{font-size:15px;color:var(--muted)}
.pill b{font-size:19px;font-weight:500}
.pill.today:not(.on){border-color:var(--color-primary);color:var(--brand-ink)}
.pill.on{background:var(--color-primary);border-color:var(--color-primary);color:var(--on-primary)}
.pill.on span{color:var(--on-primary);opacity:.85}
.pill.on i.has{background:var(--on-primary)}
.pill:hover:not(.on){background:var(--hover);border-color:var(--color-accent)}

/* ===== 8. MENU – KARTY PLÁNU, DLAŽDICE ===== */
.plan{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(160px,auto);gap:12px}
.pcard{position:relative;overflow:hidden;border:0;border-radius:var(--r-lg);background:var(--c);color:var(--tc);text-align:left;padding:18px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;box-shadow:var(--shadow-soft)}
.pcard.tall{grid-row:span 2}
.pcard.wide,.plan.one .pcard{grid-column:1/-1}
.pcard:hover{filter:brightness(1.04)}
.tag{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--glass);font-size:14px;margin-bottom:12px;color:var(--color-black)}
.pcard b{font-size:clamp(21px,5.6vw,26px);font-weight:500;line-height:1.1;margin-bottom:8px;max-width:100%;overflow-wrap:anywhere}
.pcard span.l{font-size:15px;font-variant-numeric:tabular-nums}
.pcard>*:not(.big-ic){position:relative;z-index:1}
.big-ic{position:absolute;right:-10px;bottom:-14px;font-size:60px;line-height:1;opacity:.9;filter:drop-shadow(0 10px 12px var(--shade-20));width:78px;height:78px;display:grid;place-items:center;border-radius:24px;overflow:hidden}
.big-ic img{width:100%;height:100%;object-fit:cover}
.pcard.tall .big-ic{font-size:96px;width:112px;height:112px}
.add-card{border:2px dashed var(--color-accent);background:var(--surface);border-radius:var(--r-lg);min-height:140px;display:grid;place-items:center;gap:8px;color:var(--muted);font-size:16px;width:100%}
.add-card span{color:var(--brand-ink)}
.add-card:hover{background:var(--hover)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
/* Budoucí dlaždice: bílé karty s jemným stínem, hover světle zelená */
.tile{display:grid;gap:8px;align-content:start;padding:16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-soft);color:var(--ink);text-decoration:none}
.tile:hover{background:var(--hover);border-color:var(--color-accent)}
.tile svg{width:26px;height:26px;color:var(--brand-ink)}
/* dlaždice Narozeniny a svátky */
.tile.bday{gap:4px;transition:background-color var(--ease),border-color var(--ease)}
.tile.bday .bd-ic{font-size:26px;line-height:1.2}
.tile.bday b{font-weight:500;font-size:17px}
.tile.bday small{color:var(--muted);font-size:14px}
.tile.bday .bd-when{margin-top:4px;font-size:14px;font-weight:500;color:var(--brand-ink)}
.tile.bday.today{background:var(--today-bg);border-color:var(--color-accent)}
.up-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.up-list li button{width:100%;display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px;align-items:center;text-align:left;padding:8px;border-radius:var(--r-md);border:0;background:transparent}
.up-list li button:hover{background:var(--hover)}
.up-list b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up-list small{color:var(--muted);font-size:13.5px}
.ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--c,var(--surface-soft));overflow:hidden;flex:none}
.ic img{width:100%;height:100%;object-fit:cover}
@media(min-width:900px){.plan{grid-template-columns:repeat(4,minmax(0,1fr))}.pcard.wide{grid-column:auto}.pcard.tall{grid-row:auto}.pcard.tall .big-ic{font-size:76px;width:92px;height:92px}}

/* ===== 9. KALENDÁŘ ===== */
.hero.clock .hero-txt{max-width:60%}
.clock-t{font-size:clamp(34px,10vw,64px);font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.clock-d{font-size:16px;font-weight:600;margin-bottom:6px}
.clock-d::first-letter{text-transform:uppercase}
.cal-bar{display:flex;align-items:center;gap:8px;margin:26px 0 14px}
.cal-bar h2{flex:1;font-size:clamp(22px,6vw,32px);white-space:nowrap}
.cal-bar h2::first-letter{text-transform:uppercase}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-grid .wd{text-align:center;font-size:14px;color:var(--muted);padding-bottom:4px}
.day{height:58px;border-radius:18px;border:1px solid var(--line);background:var(--surface);display:grid;grid-template-rows:10px auto;justify-items:center;align-content:center;gap:2px;font-size:18px;font-variant-numeric:tabular-nums;padding:0}
.day:hover{background:var(--hover);border-color:var(--color-accent)}
.day.out{border-color:transparent;background:transparent;color:var(--muted)}
.day.today{background:var(--color-primary);border-color:var(--color-primary);color:var(--on-primary);font-weight:600}
.day .dts{display:flex;gap:3px;height:7px}
.day .dts i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px var(--shade-25)}
.day.today .dts i{box-shadow:0 0 0 1.5px var(--color-white)}
@media(min-width:900px){.day{height:74px;border-radius:20px}}

/* ===== 10. DETAIL DNE – ČASOVÁ OSA ===== */
.day-bar{position:sticky;top:0;z-index:5;background:var(--page);padding:6px 0 14px}
.day-row{display:flex;align-items:center;gap:8px}
.day-row .mid{flex:1;text-align:center}
.day-row h2{font-size:clamp(22px,5.6vw,28px)}
.day-row h2::first-letter{text-transform:uppercase}
.day-row small{color:var(--muted);font-size:14px}
.timeline{position:relative;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-soft);cursor:copy}
.hr{position:absolute;left:0;right:0;height:60px;border-top:1px solid var(--line)}
.hr:first-child{border-top:0}
.hr span{position:absolute;left:14px;top:-10px;padding:0 4px;background:var(--surface);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hr:first-child span{top:4px}
.blk{position:absolute;border:0;border-radius:14px;padding:6px 10px;text-align:left;background:var(--c);color:var(--tc);overflow:hidden;display:flex;gap:8px;align-items:flex-start;box-shadow:0 0 0 2px var(--surface);font-size:14px;line-height:1.2}
.blk .bi{font-size:18px;line-height:1;flex:none;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;overflow:hidden}
.blk .bi img{width:100%;height:100%;object-fit:cover}
.blk b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk small{opacity:.92;font-variant-numeric:tabular-nums;white-space:nowrap}
.blk:hover{filter:brightness(1.05)}
.blk.short{align-items:center;padding-top:0;padding-bottom:0}
.blk.short small{display:none}
.now{position:absolute;left:62px;right:6px;height:2px;background:var(--color-primary);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-6px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--color-primary)}

/* ===== 11. TÝDENNÍ PŘEHLED ===== */
.week-bar{display:flex;align-items:center;gap:8px;margin-top:6px}
.week-bar .mid{flex:1;text-align:center}
.week-bar h2{font-size:clamp(24px,6vw,30px);color:var(--brand-ink)}
.week-bar small{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.week-sum{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.week-sum div{border-radius:var(--r-lg);padding:16px 18px;color:var(--on-primary);box-shadow:var(--shadow-soft)}
.week-sum div:first-child{background:var(--color-primary)}
.week-sum div:last-child{background:var(--sum-dark)}
.week-sum b{display:block;font-size:clamp(26px,7vw,36px);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.week-sum span{font-size:14px;opacity:.85}
.week-grid{display:grid;gap:12px}
.wday{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;display:grid;gap:8px;align-content:start;box-shadow:var(--shadow-soft)}
.wday h3{font-size:17px;font-weight:500;display:flex;justify-content:space-between;gap:6px;padding:0 4px}
.wday h3 span{color:var(--muted);font-variant-numeric:tabular-nums}
.wday.today{background:var(--today-bg);border-color:var(--color-accent)}
.wday.today h3,.wday.today h3 span{color:var(--brand-ink)}
.witem{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border:0;border-radius:var(--r-md);background:var(--c);color:var(--tc)}
.witem:hover{filter:brightness(1.05)}
.witem .wi{font-size:20px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--glass);overflow:hidden}
.witem .wi img{width:100%;height:100%;object-fit:cover}
.witem b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.witem small{font-size:13px;opacity:.92;font-variant-numeric:tabular-nums;white-space:nowrap}
.wday .none{font-size:14px;color:var(--muted);padding:0 4px 2px}
@media(min-width:1000px){.week-grid{grid-template-columns:repeat(7,minmax(0,1fr))}.wday{min-height:280px;padding:10px}
  .wday h3{flex-direction:column;gap:0}.witem{grid-template-columns:1fr;gap:6px;padding:10px}.witem b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2}}

/* ===== 12. MODÁLNÍ FORMULÁŘ ===== */
.modal-back{position:fixed;inset:0;z-index:60;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:580px;max-height:94dvh;background:var(--surface);border-radius:20px 20px 0 0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;box-shadow:var(--shadow);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media(min-width:640px){.modal-back{align-items:center}.modal{border-radius:20px}}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:20px 18px 10px 24px}
.modal header h2{font-size:28px;font-weight:500;color:var(--ink)}
.modal-body{overflow-y:auto;padding:8px 24px 18px;display:grid;gap:20px}
.modal footer{display:flex;gap:8px;padding:14px 24px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.modal footer .sp{flex:1}
fieldset{border:0;margin:0;padding:0;display:grid;gap:10px}
legend{font-weight:500;font-size:15px;padding:0;margin-bottom:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--hover);border-color:var(--color-accent)}
.chip[aria-pressed=true]{background:var(--color-primary);border-color:var(--color-primary);color:var(--on-primary)}
.tpl-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tpl{flex:none;display:flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:999px;border:0;background:var(--c);color:var(--tc);max-width:240px}
.tpl:hover{filter:brightness(1.05)}
.tpl .ic{width:34px;height:34px;font-size:18px;background:var(--glass)}
.tpl span{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpl small{font-size:13px;opacity:.75;white-space:nowrap}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;max-height:164px;overflow-y:auto;padding:2px}
.emoji-grid button{height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:22px}
.emoji-grid button:hover{background:var(--hover);border-color:var(--color-accent)}
.emoji-grid button[aria-pressed=true]{border-color:var(--color-primary);background:var(--hover)}
.icon-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.icon-row .ic{width:60px;height:60px;font-size:30px}
.upload{position:relative;overflow:hidden}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw{width:40px;height:40px;border-radius:50%;border:0;background:var(--c);box-shadow:inset 0 0 0 1px var(--shade-12)}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--color-primary)}
.cpick{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--muted)}
.cpick input{width:44px;height:40px;padding:0;border:0;background:none}
.inline{display:flex;gap:10px;align-items:center}
.inline input{max-width:140px}

/* ===== 13. TOASTY, PANEL ZVONKU ===== */
.toasts{position:fixed;z-index:80;top:12px;left:50%;transform:translateX(-50%);width:min(440px,94vw);display:grid;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:grid;grid-template-columns:50px minmax(0,1fr);gap:12px;align-items:center;padding:14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--color-primary);box-shadow:var(--shadow);animation:drop .25s ease-out}
@keyframes drop{from{transform:translateY(-14px);opacity:0}}
.toast .ic{width:50px;height:50px}
.toast b{display:block;font-weight:600}
.toast small{color:var(--muted);font-size:14px}
.toast .acts{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.toast.info{grid-template-columns:1fr;background:var(--color-primary);border-color:var(--color-primary);color:var(--on-primary)}
.bell-panel{position:fixed;z-index:70;top:76px;right:max(12px,calc((100vw - 1100px)/2 + 12px));width:min(380px,94vw);max-height:70dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px}
.bell-panel h2{font-size:20px;margin-bottom:10px}

/* ===== 14. NASTAVENÍ ===== */
.set-grid{display:grid;gap:14px;max-width:720px}
.set-grid .card{display:grid;gap:14px}
.set-grid h2{font-size:22px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;padding:4px;gap:4px;width:max-content;background:var(--surface)}
.seg button{min-height:40px;padding:0 20px;border:0;border-radius:999px;background:transparent}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed=true]{background:var(--color-primary);color:var(--on-primary)}
.pin-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
@media(max-width:560px){.pin-form{grid-template-columns:1fr}}
.tpl-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tpl-list li{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;border-radius:999px;padding:6px;background:var(--c);color:var(--tc)}
.tpl-list li .ic{background:var(--glass)}
.tpl-list b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpl-list small{font-size:13px;opacity:.75}
.tpl-list .btn{background:var(--color-white);color:var(--color-black);border-color:transparent}
.tpl-list .btn:hover{background:var(--color-black);color:var(--color-white)}
.msg{font-size:14px;font-weight:500}
.msg.ok{color:var(--brand-ink)}.msg.bad{color:var(--color-error)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ===== 15. FINANCE + PROPOJENÍ S KALENDÁŘEM ===== */
.check{display:flex;gap:12px;align-items:center;min-height:52px;padding:10px 16px;border:1.5px solid var(--line);border-radius:var(--r-md);background:var(--surface);font-weight:500;cursor:pointer;transition:background-color var(--ease),border-color var(--ease)}
.check input{width:22px;height:22px;accent-color:var(--color-primary);flex:none;margin:0}
.check:has(input:checked){background:var(--hover);border-color:var(--color-accent)}
.mtag{font-size:.9em;margin-right:3px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:disabled:hover{background:var(--surface);border-color:var(--line)}
.btn.primary:disabled:hover{background:var(--color-primary);border-color:var(--color-primary)}
.bar{display:block;height:8px;border-radius:999px;background:var(--color-bar-bg);overflow:hidden}
.bar i{display:block;height:100%;width:var(--w);border-radius:inherit;background:var(--color-primary);transition:width .4s ease}
.bar.over i{background:var(--color-neon);box-shadow:inset 0 0 0 1px var(--color-secondary)}
.gb-t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;font-variant-numeric:tabular-nums}
.gb-t b{color:var(--brand-ink)}
.gb-go{color:var(--brand-ink);font-weight:600;white-space:nowrap}
.goalbar{display:grid;gap:8px;width:100%;margin-top:14px;padding:12px 16px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-soft)}
.goalbar:hover{background:var(--hover);border-color:var(--color-accent)}
.meet-strip{display:block;width:100%;margin-top:12px;padding:10px 16px;text-align:left;border:1px solid var(--color-accent);border-radius:999px;background:var(--today-bg);color:var(--brand-ink);font-weight:500;font-size:14px}
.meet-strip:hover{background:var(--color-accent);color:var(--color-black)}
.fin-grid{display:grid;gap:16px;padding-top:4px}
.fin-col{display:grid;gap:16px;align-content:start}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-soft);padding:20px;display:grid;gap:14px;align-content:start}
.fcard h2{font-size:20px;font-weight:700;color:var(--brand-ink)}
.fcard .row2{align-items:end}
.fcard p{line-height:1.45}
.hint{font-weight:400;color:var(--muted);font-size:13.5px}
.unit{position:relative;display:block}
.unit input{padding-right:52px}
.unit>span{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-weight:400}
.res-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.res{display:grid;gap:2px;padding:14px;border-radius:14px;background:var(--today-bg)}
.res.wide{grid-column:1/-1}
.res .e{font-size:20px}
.res b{font-size:clamp(22px,6vw,30px);font-weight:700;color:var(--brand-ink);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.res span:last-child{font-size:14px;color:var(--ink)}
.goal{display:grid;gap:12px;padding:14px;border-radius:14px;border-left:6px solid var(--st);background:var(--surface-soft)}
.goal[data-s=low]{--st:var(--color-status-low)}
.goal[data-s=mid]{--st:var(--color-status-mid)}
.goal[data-s=ok]{--st:var(--color-primary)}
.bar.status i{background:var(--st)}
.bar.status.over i{background:var(--color-neon)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;margin:0;font-size:15px}
.kv dt{color:var(--ink)}
.kv dd{margin:0;text-align:right;font-weight:600;color:var(--brand-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.wchart{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;height:200px;padding-top:6px;max-width:600px}
.wcol{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:6px;min-width:0}
.wplot{position:relative;border-bottom:1.5px solid var(--line)}
.wbar{position:absolute;left:18%;right:18%;bottom:0;border-radius:8px 8px 0 0;background:var(--color-accent);transition:height .4s ease}
.wbar.hit{background:var(--color-primary)}
.wval{position:absolute;left:0;right:0;text-align:center;font-size:13px;font-weight:600;color:var(--ink)}
.wtarget{position:absolute;left:4%;right:4%;border-top:2px dashed var(--color-text-muted)}
.wlab{font-size:12px;color:var(--muted);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.wcol.cur .wlab{color:var(--brand-ink);font-weight:700}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--muted)}
.lg-bar{display:inline-block;width:14px;height:10px;border-radius:3px;background:var(--color-accent)}
.lg-bar.hit{background:var(--color-primary)}
.lg-line{display:inline-block;width:18px;border-top:2px dashed var(--color-text-muted)}
.split{display:flex;height:40px;border-radius:12px;overflow:hidden;font-size:14px;font-weight:600}
.split span{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;padding:0 8px;min-width:0}
.sa{background:var(--color-accent);color:var(--color-black)}
.sf{background:var(--color-primary);color:var(--color-white)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:1px}
.hist{display:grid;gap:8px}
.hitem{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.hitem[open]{border-color:var(--color-accent);background:var(--hover)}
.hitem summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;list-style:none}
.hitem summary::-webkit-details-marker{display:none}
.hitem summary b{display:block;font-weight:600}
.hitem summary small{color:var(--muted);font-size:14px}
.chev{font-size:22px;color:var(--brand-ink);transition:transform var(--ease)}
.hitem[open] .chev{transform:rotate(90deg)}
.hitem .kv,.hitem .btn-row{padding:0 16px 14px}
.toast.party{grid-template-columns:54px minmax(0,1fr);background:linear-gradient(135deg,var(--color-primary),var(--color-secondary));color:var(--color-white);border:0;animation:partyIn .45s ease-out}
.toast.party b{font-size:20px;font-weight:700}
.toast.party small{color:var(--color-white);opacity:.92;font-size:15px}
.party-ic{font-size:40px;text-align:center}
.toast.party .btn{background:var(--color-white);color:var(--color-primary);border-color:transparent}
@keyframes partyIn{from{transform:translateY(-30px);opacity:0}}
@media(min-width:900px){
  .fin-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .fin-hist{grid-column:1/-1}
}

/* ===== 16. DOKUMENTY (dříve Výpovědi) – formulář, náhled A4, prohlížeč, tisk ===== */
.vyp-form{display:grid;gap:18px}
.vyp-form fieldset{display:grid;gap:12px;padding-top:4px}
.vyp-form legend{font-weight:700;color:var(--brand-ink);font-size:16px;margin-bottom:8px}
.typ-seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;border-radius:22px}
.typ-seg button{padding:6px 8px;font-size:14.5px;line-height:1.15;white-space:normal;border-radius:18px;min-height:44px}
.field-err{color:var(--color-error);font-size:13px;font-weight:500}
textarea.plain{font-family:var(--font);font-size:16px;min-height:64px;resize:vertical}
.vyp-missing{font-size:13.5px;color:var(--muted)}
.vyp-text{white-space:pre-wrap;font-family:"BP Serif",Georgia,"Times New Roman",serif;font-size:15px;line-height:1.55;color:var(--ink);background:var(--surface-soft);border:1px solid var(--line);border-radius:14px;padding:20px;overflow-wrap:anywhere}
.vyp-text.small{font-size:14px;margin:0 16px 12px}
.tchip{display:inline-block;padding:1px 10px;border-radius:999px;background:var(--color-accent-soft);color:var(--color-primary);font-size:12.5px;font-weight:600;margin-right:4px;vertical-align:1px}
.vwarn{margin-bottom:16px;border-left:6px solid var(--color-status-mid)}
.warn-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.warn-list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--surface-soft)}
.warn-list b{display:block;font-weight:600}
.warn-list small{color:var(--muted);font-size:13.5px}
/* Náhled A4: stránky v reálných mm, zmenšené na šířku karty (transform) */
.a4-wrap{position:relative;width:100%;max-width:560px;margin:0 auto;overflow:hidden}
@media(min-width:900px){.a4-wrap{max-width:min(560px,calc((100dvh - 330px) / 1.414))}}   /* celá stránka + tlačítka se vejdou na výšku */
.a4-stack{position:absolute;top:0;left:0;width:210mm;display:grid;gap:8mm;transform-origin:0 0;transform:scale(var(--s,.4))}
.a4{position:relative;width:210mm;height:297mm;overflow:hidden;background:var(--paper);color:var(--paper-ink);font:14pt/15.75pt "BP Serif","Times New Roman",Times,serif;border:1px solid var(--color-border);box-shadow:0 18px 40px -18px rgba(43,43,43,.35);user-select:none;-webkit-user-select:none}
.a4 .ln{position:absolute;left:25mm;white-space:pre}
.a4 b{font-weight:700}
.a4 mark{background:var(--color-accent-soft);color:var(--color-primary);border-radius:3px;padding:0 1mm}
@media(min-width:900px){.vyp-prev{position:sticky;top:0}}
/* prohlížeč dokumentu (Náhled) */
.viewer{position:fixed;inset:0;z-index:65;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--overlay);backdrop-filter:blur(2px);animation:fade .2s ease}
.viewer-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow-soft)}
.viewer-bar b{font-weight:600;color:var(--brand-ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.viewer-bar .muted{font-size:13px}
.viewer-bar .sp{flex:1}
.viewer-bar .zoom button{min-height:34px;padding:0 12px;font-size:13.5px}
.viewer-bar .btn.small{min-height:36px;padding:0 12px;font-size:14px}
.viewer-bar .circle{width:40px;height:40px}
.viewer-body{overflow:auto;padding:20px 12px 40px}
.viewer-wrap{max-width:820px!important}
.viewer-wrap.real{width:calc(210mm + 2px)!important;max-width:none!important}
@media(max-width:600px){.viewer-bar b{flex-basis:100%}}
#printSheet{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{height:auto!important;overflow:visible!important;background:var(--paper)!important}
  body.printing>*:not(#printSheet){display:none!important}
  body.printing #printSheet{display:block!important}
  body.printing #printSheet .a4{border:0;box-shadow:none;break-after:page;page-break-after:always}
  body.printing #printSheet .a4:last-child{break-after:auto;page-break-after:auto}
  body.printing #printSheet mark{background:none;color:inherit}
}

/* ===== 17. KLIENTI ===== */
.nav a{position:relative}
.nbadge{position:absolute;top:2px;right:2px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--warn-ink);color:var(--color-white);font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface);line-height:1}
.cl-warn{position:relative;background:var(--warn-bg);color:var(--warn-ink);border-radius:16px;padding:14px 46px 14px 16px;margin-bottom:16px;box-shadow:var(--shadow-soft)}
.cl-warn ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.cl-warn li button{background:none;border:0;padding:4px 0;color:inherit;text-align:left;font-size:15px;line-height:1.35}
.cl-warn li button:hover{text-decoration:underline}
.cl-warn-x{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:inherit;font-size:16px}
.cl-warn-x:hover{background:rgba(184,110,0,.12)}
.cl-warn-more{margin-top:6px;background:none;border:0;padding:0;color:inherit;font-weight:700;text-decoration:underline}
.cl-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cl-search{flex:1 1 240px;position:relative;display:block}
.cl-search span{position:absolute;left:16px;top:50%;transform:translateY(-50%);pointer-events:none}
.cl-search input{width:100%;min-height:52px;padding:12px 16px 12px 46px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-size:16px}
.cl-search input:focus{outline:none;border-color:var(--color-primary);box-shadow:0 0 0 3px var(--hover)}
.cl-sortrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.cl-sortrow .seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;max-width:480px;border-radius:22px}
.cl-sortrow .seg button{font-size:13.5px;padding:4px 8px;line-height:1.15;white-space:normal;border-radius:18px;min-height:42px}
.cl-list{display:grid;gap:10px}
@media(min-width:900px){.cl-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cl-row{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow-soft)}
.cl-row:hover{background:var(--hover);border-color:var(--color-accent)}
.cl-ava{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--color-accent);color:var(--color-black);font-weight:700;font-size:16px}
.cl-ava.big{width:64px;height:64px;font-size:22px;flex:none}
.cl-main b{display:block;font-size:16.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-main small{display:block;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-meta{display:grid;justify-items:end;gap:4px}
.cl-meta small{font-size:12.5px;color:var(--muted);white-space:nowrap}
.cl-meta small.soon{color:var(--warn-ink);font-weight:600}
.pbadge{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--color-primary);color:var(--on-primary);font-size:12.5px;font-weight:600;white-space:nowrap}
.cl-empty{display:grid;justify-items:center;text-align:center;gap:8px;padding:32px 20px}
.cl-empty span{font-size:40px}
.cl-deleted{margin-top:16px}
.cl-back{margin-bottom:12px}
.cl-head{display:flex;gap:14px;align-items:center}
.cl-name{font-size:clamp(26px,6.5vw,32px)!important;color:var(--ink)!important;font-weight:600!important}
.cl-kv dd{white-space:normal;text-align:right;font-weight:500}
.cl-kv dd.pre{white-space:pre-line}
.cl-note{background:var(--surface-soft);border-radius:12px;padding:12px 14px;white-space:pre-line;font-size:15px}
.cl-confirm{background:var(--warn-bg);color:var(--warn-ink);border-radius:14px;padding:14px;display:grid;gap:10px}
.linkbtn{background:none;border:0;padding:0;color:var(--brand-ink);text-decoration:underline;font-size:inherit}
.prod-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.prod{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--today-bg)}
.prod-ic{font-size:22px;line-height:1.1}
.prod b{display:block;font-weight:600;font-size:14.5px;color:var(--brand-ink)}
.prod span,.prod small{display:block;font-size:14px}
.prod small{color:var(--muted)}
.dates{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.dates li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface-soft)}
.dates li.soon{background:var(--warn-bg);color:var(--warn-ink)}
.dates li.soon small{color:var(--warn-ink)}
.d-ic{font-size:20px}
.dates b{display:block;font-weight:600;font-size:15px}
.dates small{color:var(--muted);font-size:13px}
.d-in{font-weight:700;font-size:14px;white-space:nowrap}
.ctimeline{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--color-accent);display:grid;gap:14px}
.ctimeline>li{position:relative}
.ctimeline>li::before{content:"";position:absolute;left:-25px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--color-primary);border:2px solid var(--surface)}
.ctimeline>li.t-smazani::before{background:var(--color-error)}
.t-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.t-head small{color:var(--muted)}
.t-sum{font-size:14.5px;margin-top:4px}
.changes{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px;font-size:14.5px}
.ch-f{font-weight:600}
.changes del{color:var(--color-error)}
.changes ins{color:var(--brand-ink);text-decoration:none;font-weight:600}
.modal.wide{max-width:760px}
.fs{border-top:1px solid var(--line)!important;padding-top:14px!important}
.fs:first-child{border-top:0!important;padding-top:0!important}
.fs legend{font-weight:700;color:var(--brand-ink);font-size:17px;margin-bottom:6px;padding:0}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:560px){.row3{grid-template-columns:1fr 1fr}.row3>:first-child{grid-column:1/-1}}
.pform{display:grid;gap:12px}
@media(min-width:700px){.pform{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pform section{display:grid;gap:10px;align-content:start;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface-soft)}
.pform h3{font-size:16px;font-weight:700;color:var(--brand-ink)}
.vyr-list{display:grid;gap:6px}
.vyr-row input{flex:1;max-width:none!important}
.circle.small{width:40px;height:40px;font-size:14px}
.seg.mini{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}
.seg.mini button{padding:0 6px;font-size:14px}
.persons{display:grid;gap:10px}
.person{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface-soft)}
.person .btn{justify-self:start}
/* přepínač (toggle switch) */
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;cursor:pointer;font-weight:500}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .tr{position:relative;flex:none;width:52px;height:30px;border-radius:999px;background:var(--color-border);transition:background-color var(--ease)}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--color-white);box-shadow:0 1px 3px rgba(43,43,43,.3);transition:transform var(--ease)}
.switch input:checked+.tr{background:var(--color-primary)}
.switch input:checked+.tr::after{transform:translateX(22px)}
.switch input:focus-visible+.tr{outline:3px solid var(--color-secondary);outline-offset:2px}

/* ===== 18. VZDĚLÁVÁNÍ ===== */
.edu-top{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;margin-bottom:16px}
.edu-pills{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none;max-width:100%}
.edu-pills::-webkit-scrollbar{display:none}
.edu-pill{flex:none;min-height:42px;padding:0 16px;border-radius:999px;border:1.5px solid var(--today-bg);background:var(--today-bg);color:var(--brand-ink);font-weight:500;font-size:15px;white-space:nowrap}
.edu-pill:hover{border-color:var(--color-accent)}
.edu-pill.on{background:var(--color-primary);border-color:var(--color-primary);color:var(--on-primary)}
.edu-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
.edu-actions .muted{font-size:13px}
.edu-grid{display:grid;gap:12px}
@media(min-width:900px){.edu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.edu-card{position:relative;display:grid;gap:8px;align-content:start;padding:16px 18px 16px 22px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-soft);cursor:pointer;overflow:hidden}
.edu-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tc,var(--color-accent))}
.edu-card:hover{border-color:var(--color-accent)}
.edu-card h3{font-size:17px;font-weight:600;line-height:1.3;color:var(--ink)}
.edu-card p{font-size:14.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.edu-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.edu-chip{display:inline-block;padding:1px 10px;border-radius:999px;background:color-mix(in srgb,var(--tc,var(--color-accent)) 18%,transparent);color:var(--ink);font-weight:600;font-size:12.5px}
.edu-read{justify-self:start;font-weight:600;color:var(--brand-ink);text-decoration:none;padding:6px 0}
.edu-read:hover{text-decoration:underline}
.edu-card.fade{animation:eduIn .35s ease both}
@keyframes eduIn{from{opacity:0;transform:translateY(6px)}}
.edu-card.skel{cursor:default}
.edu-card.skel::before{background:var(--line)}
.edu-card.skel i{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--surface-soft) 25%,var(--line) 50%,var(--surface-soft) 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.edu-card.skel i:nth-child(2){height:20px;width:85%}
.edu-card.skel i.short{width:40%}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.edu-empty{display:grid;justify-items:center;text-align:center;gap:10px;padding:28px 20px}
.edu-empty>span{font-size:40px}
.edu-links{display:grid;gap:6px;justify-items:center;margin-top:8px}
.edu-links a{color:var(--brand-ink);font-weight:600}
.edu-warn{font-size:14px;color:var(--warn-ink);background:var(--warn-bg);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.edu-more{display:flex;justify-content:center;margin-top:16px}
.edu-src{margin-top:20px}
.edu-src-body{padding:0 16px 16px;display:grid;gap:12px}
.edu-src-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.edu-src-list li{display:grid;gap:6px;padding:10px 12px;border-radius:12px;background:var(--surface-soft)}
.edu-src-list .switch small{display:block;color:var(--muted);font-size:12.5px;font-weight:400;overflow-wrap:anywhere}
.edu-src-list .btn{justify-self:start}
.edu-add{display:grid;gap:8px}
@media(min-width:700px){.edu-add{grid-template-columns:1fr 2fr auto;align-items:center}}
.art-title{font-size:22px!important;line-height:1.25!important}
.art-text{display:grid;gap:10px;font-size:16px;line-height:1.6}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== 19. TABULKA KLIENTA =====
   Rozměry v „px fotky“ (předloha 1597 px na šířku); na obrazovce se list zmenší vlastností zoom (--tkz),
   v tisku na šířku A4. Barvy listu jsou pevné podle předlohy (i v tmavém režimu jde o „papír“). */
.wrap.tk-wrap{max-width:1680px}
.tk-pick{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;margin-bottom:14px}
.tk-pick .f{flex:1 1 260px;margin:0}
.tk-pick .muted{font-size:14px;padding-bottom:12px}
.tk-scroll{overflow-x:auto;background:#fff;border-radius:16px;box-shadow:var(--shadow-soft);padding:14px;border:1px solid var(--line)}
.tk-sheet{--tkline:#707070;--tkgreen:#03A339;--tkgreen-t:#06A23F;--tkgrp:#D6ECD5;--tkgrey:#F2F2F2;
  width:1597px;zoom:var(--tkz,1);color-scheme:light;background:#fff;color:#222;
  font-family:'BP Sans',Verdana,'DejaVu Sans',Geneva,sans-serif;font-size:12px;line-height:1.2;text-align:left}
.tk-banner{display:block;width:1596px;height:78px;object-fit:cover}
.tk-t{border-collapse:separate;border-spacing:0;table-layout:fixed;width:1597px}
.tk-t th,.tk-t td{padding:0;border-right:1px solid var(--tkline);border-bottom:1px solid var(--tkline);vertical-align:middle;text-align:center;background:#fff}
.tk-t tr>:first-child{border-left:1px solid var(--tkline)}
.tk-t .grp th{height:26px;border:0;font-weight:700;font-size:11.5px;color:var(--tkgreen-t);background:#fff}
.tk-t .grp th.on{background:var(--tkgrp)}
.tk-t .grp th:first-child{border-left:0}
.tk-t .grp img{height:20px;vertical-align:middle;margin-right:28px}
.tk-t .h1 th{height:23px;border-top:1px solid var(--tkline);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.tk-t .h1 th[rowspan]{height:38px}
.tk-t .h2 th{height:14px;font-size:9.5px;font-weight:700;text-align:left;padding-left:14px;white-space:nowrap}
.tk-t .h2 th span{font-weight:400}
.tk-t .h2 th.big{font-size:12.5px;text-align:center;padding:0}
.tk-t tbody.tk-p tr.a td{background:var(--tkgrey);height:83px}
.tk-t tbody.tk-p tr.b td{height:64px}
.tk-t tbody.tk-p tr.c td{background:var(--tkgreen);height:14px;color:#fff;border-right-color:var(--tkgreen);border-bottom:0}
.tk-t tbody.tk-p tr.c td:last-child{border-right-color:var(--tkline)}
.tk-t tbody.tk-gap td{height:4px;border:0;border-top:1px solid var(--tkline);background:#fff}
.tk-t tbody.tk-gap td:first-child{border-left:0}
/* sloupec Klient */
.tk-t td.tk-kl{background:#fff!important;vertical-align:top;text-align:left;border-bottom:1px solid var(--tkline)!important;position:relative}
.tk-klbox{display:grid;grid-template-rows:84px 30px 34px 15px;height:163px}
.tk-name{display:grid;align-content:center;gap:12px;text-align:center;font-size:15px;font-weight:700}
.tk-kv{display:grid;grid-template-columns:54px 1fr;align-items:center;font-size:9.5px;padding-left:3px}
.tk-kv>:last-child{font-weight:700;text-align:center;font-size:10px}
.tk-no{position:absolute;top:3px;left:3px;padding:1px 5px;border-radius:9px;background:#E8F5EE;color:#2F5D3A;font-size:8.5px;font-weight:700;line-height:15px}
.tk-del{position:absolute;top:2px;right:3px;padding:1px 5px;border-radius:10px;border:1px solid #E0E0E0;background:#fff;color:#8a2a20;font:inherit;font-size:8.5px;font-weight:700;line-height:14px;cursor:pointer;white-space:nowrap}
.tk-del:hover,.tk-del:focus-visible{border-color:#C0392B;outline:0}
.tk-del.armed{left:3px;background:#C0392B;border-color:#C0392B;color:#fff;z-index:3}
.tk-t td.tk-kl .tk-name{padding-top:10px}
/* výběr barvy textu (plovoucí panel nad políčkem) */
.tk-pick-col{position:fixed;z-index:60;display:flex;gap:6px;padding:5px 7px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.16)}
.tk-pick-col[hidden]{display:none}
.tk-pick-col button{width:20px;height:20px;border-radius:50%;padding:0;border:2px solid #E0E0E0;cursor:pointer;box-shadow:inset 0 0 0 2px var(--surface)}
.tk-pick-col button[aria-pressed="true"]{border-color:#2F5D3A;transform:scale(1.12)}
.tk-pick-col button:hover{border-color:#6BAF85}
/* sloupec Klient zůstává při vodorovném posouvání vidět (mobil) */
.tk-t .h1 th:first-child,.tk-t td.tk-kl{position:sticky;left:0;z-index:2}
.tk-t tbody.tk-gap td{position:sticky;left:0}
/* buňky */
.tk-v,.tk-in{display:block;width:100%;font:inherit;font-weight:700;font-size:14px;text-align:center;color:inherit;min-height:1.2em}
.g .tk-v,.g .tk-in,.tk-in.g,.tk-v.g{color:var(--tkgreen-t)}
.tk-in{border:1px solid transparent;border-radius:4px;background:transparent;padding:2px 3px;cursor:text;outline:0;transition:border-color .15s,box-shadow .15s}
.tk-in:hover{border-color:#bdbdbd;background:rgba(255,255,255,.6)}
.tk-in:focus{border-color:var(--color-primary);box-shadow:0 0 0 2px rgba(47,93,58,.25);background:#fff}
.tk-in::placeholder{color:#9a9a9a;font-weight:700;opacity:1}
select.tk-in{appearance:none;-webkit-appearance:none;padding:0 2px;cursor:pointer}
.tk-prod .tk-in,.tk-prod .tk-v{font-size:13px}
.tk-name .tk-in,.tk-name .tk-v{font-size:15px}
.tk-kv .tk-in,.tk-kv .tk-v{font-size:9px;padding:1px 2px}
tr.c .tk-in,tr.c .tk-v{font-size:9.5px;color:#fff;background:transparent;padding:0 2px;line-height:13px;min-height:0}
tr.c .tk-in::placeholder{color:rgba(255,255,255,.5);font-weight:400}
tr.c .tk-in:focus{background:rgba(0,0,0,.18);box-shadow:none;border-color:#fff}
/* invalidita I./II./III. */
.tk-inv{display:grid;grid-template-rows:repeat(3,1fr);height:100%;padding:3px 4px}
.tk-inv>div{display:grid;grid-template-columns:26px 1fr;align-items:center}
.tk-inv b{font-family:'Times New Roman',Times,'Liberation Serif',serif;font-weight:400;font-size:10.5px;text-align:left}
tr.b .tk-inv b{font-family:inherit;font-weight:700;color:var(--tkgreen-t);font-size:10.5px}
.tk-inv .tk-in,.tk-inv .tk-v{font-size:12px;text-align:left}
/* trvalé následky + hospitalizace: dělené buňky s tečkovanou linkou */
.tk-split{display:grid;height:100%}
.tk-split.r3{grid-template-rows:33px 33px 1fr}
.tk-split.r2{grid-template-rows:1fr 1fr}
.tk-split>div{display:grid;align-items:center;border-bottom:1px dotted #8a8a8a}
.tk-split>div:last-child{border-bottom:0}
.tk-tn>div{grid-template-columns:1fr 38px}
.tk-tn small{border-left:1px solid #b5b5b5;height:100%;display:grid;align-content:center;font-size:9px;line-height:1.35;text-align:center;color:#444}
.tk-hosp>div.u{grid-template-columns:50px 1fr}
.tk-hosp>div.u .tk-in,.tk-hosp>div.u .tk-v{font-size:12px}
.tk-hosp>div.u>span:first-child{font-size:9.5px;text-align:left;padding-left:4px;color:#444}
.tk-hosp .tk-in,.tk-hosp .tk-v,.tk-tn .tk-in,.tk-tn .tk-v{font-size:13.5px}
/* patička */
.tk-foot{position:relative;height:260px}
.tk-foot .pojistne{position:absolute;right:4px;top:22px;display:flex;gap:40px;align-items:center;font-weight:700;font-size:13px}
.tk-foot .pojistne .tk-in,.tk-foot .pojistne .tk-v{width:170px;text-align:right;font-size:13px;color:#222}
.tk-foot .left{position:absolute;left:4px;top:118px;width:536px}
.tk-foot .smlouva{display:flex;align-items:center;gap:14px;font-size:11.5px;font-weight:700}
.tk-foot .smlouva .tk-in,.tk-foot .smlouva .tk-v{font-family:'Times New Roman',Times,'Liberation Serif',serif;font-weight:400;font-size:16px;text-align:left;width:300px}
.tk-foot .souhlas{margin-top:14px;color:var(--tkgreen-t);font-weight:700;font-size:15px}
.tk-foot .pojistnik{margin-top:16px;color:var(--tkgreen-t);font-style:italic;font-size:14px;border-bottom:1.5px solid var(--tkgreen-t);padding-bottom:2px}
.tk-foot .right{position:absolute;right:4px;top:94px;width:238px;font-style:italic;font-weight:700;font-size:13px}
.tk-foot .right .row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.tk-foot .right .poradce{border-bottom:3px double #222;padding-bottom:2px}
.tk-foot .right img{display:block;height:46px;margin:6px 0 10px -6px}
.tk-foot .right .tk-in,.tk-foot .right .tk-v{text-align:right;font-style:italic;font-size:13px;color:#222}
.tk-foot .right .mail .tk-in,.tk-foot .right .mail .tk-v{font-weight:400;font-style:normal;font-size:11.5px;text-decoration:underline;color:#7a1c8c}
/* ovládání pod tabulkou */
.tk-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 4px}
.tk-tools select{width:auto;min-width:220px}
.tk-addbtn{background:#2F5D3A!important;color:#fff!important;border-color:#2F5D3A!important;border-radius:999px}
.tk-addbtn:hover{background:var(--color-primary-dark)!important}
.tk-addbtn:disabled{opacity:.55;cursor:not-allowed}
.tk-actions .btn{background:var(--color-primary);color:var(--color-white);border-color:var(--color-primary)}
.tk-actions .btn:hover{background:var(--color-primary-dark)}
.tk-actions .btn.danger{background:var(--surface);color:var(--color-error);border-color:var(--color-error)}
.tk-state{font-size:14px;color:var(--muted)}
@media print{
  @page tkland{size:A4 landscape;margin:10mm}
  body.printing #printSheet .tk-page{page:tkland;break-after:page;page-break-after:always}
  body.printing #printSheet .tk-page:last-child{break-after:auto;page-break-after:auto}
  body.printing #printSheet .tk-sheet{--tkz:.6556;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ---------- 2a. ŠIFROVÁNÍ DAT (AES-GCM 256) ----------
   Náhodný datový klíč šifruje každou položku zvlášť. Datový klíč je uložený dvakrát zabalený:
   klíčem odvozeným z PINu a klíčem ze záchranného kódu (PBKDF2-SHA256, 600 000 iterací).
   Bez PINu ani záchranného kódu data nejde přečíst – ani autor aplikace je neobnoví.
   Nešifrované zůstávají jen: vault (hlavička se zabalenými klíči), uiTheme (motiv zamykací obrazovky),
   pinLock (počítadlo chybných pokusů), vzdelavaniCache (veřejné články) a starý hash PINu před převodem. */
const VAULT_KEY = 'vault', THEME_KEY = 'uiTheme', PINLOCK_KEY = 'pinLock';
/** Klíče, které se šifrují (stejné názvy jako KEYS, FIN_KEYS, VYP_KEY, CL_KEYS, EDU_SET_KEY níže). */
const ENC_KEYS = new Set(['events', 'templates', 'settings', 'financeSettings', 'financeHistory', 'goalCelebrated',
  'vypovediHistory', 'dismissedWarnings', 'clients', 'clientHistory', 'dismissedClientWarnings', 'notifiedEvents', 'vzdelavaniSettings', 'tabulkaKlienta']);
const PIN_LEN = 6, KDF_ITER = 600000, SEALED = 'enc1:';
const RESCUE_ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // 32 znaků bez I, O, 0, 1 (nedají se splést)
const CRYPTO_OK = !!(window.crypto && crypto.subtle && crypto.getRandomValues);
const crypt = { key: null, vault: null };       // key = datový klíč po odemčení (jen v paměti)
try { crypt.vault = JSON.parse(localStorage.getItem(VAULT_KEY) || 'null'); } catch (e) { crypt.vault = null; }
const vaultOn = () => !!crypt.vault;
const isSealedKey = k => vaultOn() && ENC_KEYS.has(k);

const te = new TextEncoder(), td = new TextDecoder();
const toB64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const rnd = n => crypto.getRandomValues(new Uint8Array(n));

async function kekFrom(secret, saltB64, iter) {
  const base = await crypto.subtle.importKey('raw', te.encode(secret), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: fromB64(saltB64), iterations: iter },
    base, { name: 'AES-GCM', length: 256 }, false, ['wrapKey', 'unwrapKey']);
}
/** Zabalí datový klíč tajemstvím (PIN / záchranný kód); vždy nová sůl. */
async function wrapWith(dek, secret, iter = KDF_ITER) {
  const salt = toB64(rnd(16)), iv = rnd(12);
  const ct = await crypto.subtle.wrapKey('raw', dek, await kekFrom(secret, salt, iter), { name: 'AES-GCM', iv });
  return { salt, iter, iv: toB64(iv), ct: toB64(new Uint8Array(ct)) };
}
/** Rozbalí datový klíč; při špatném PINu / kódu vyhodí chybu (AES-GCM ověří integritu). */
async function unwrapWith(w, secret) {
  const kek = await kekFrom(secret, w.salt, w.iter);
  return crypto.subtle.unwrapKey('raw', fromB64(w.ct), kek, { name: 'AES-GCM', iv: fromB64(w.iv) },
    { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
}
async function sealWith(dek, txt) {
  const iv = rnd(12), ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, dek, te.encode(txt)));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12);
  return SEALED + toB64(out);
}
async function openWith(dek, s) {
  const b = fromB64(s.slice(SEALED.length));
  return td.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.subarray(0, 12) }, dek, b.subarray(12)));
}
const normRescue = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const fmtRescue = c => c.match(/.{1,4}/g).join('-');
/** 12 znaků × 5 bitů = 60 bitů náhody (32 znaků → bajt & 31 je bez zkreslení). */
const newRescueCode = () => [...rnd(12)].map(b => RESCUE_ABC[b & 31]).join('');
/** PIN (6 číslic) nebo záchranný kód → rozbalí klíč z dané hlavičky. */
const isPinLike = s => new RegExp(`^\\d{${PIN_LEN}}$`).test(String(s).trim());
const unwrapAny = (vault, secret) => isPinLike(secret) ? unwrapWith(vault.pin, String(secret).trim()) : unwrapWith(vault.rescue, normRescue(secret));
/** Snadno uhodnutelné PINy (stejné číslice, řady 123456 / 654321). */
function weakPin(p) {
  if (/^(\d)\1+$/.test(p)) return true;
  const up = '01234567890', down = '98765432109';
  return up.includes(p) || down.includes(p);
}

/* ---------- 2b. ÚLOŽIŠTĚ ----------
   cache: klíč → JSON text. U šifrovaných klíčů je to jediný zdroj pro čtení (plní se po odemčení),
   zápis jde do cache hned a do localStorage asynchronně zašifrovaný (fronta po klíčích). */
const cache = {};
const writeChain = {};
let storageWarned = false;
function storageFail() {
  if (!storageWarned) { storageWarned = true; infoToast('Data se nepodařilo uložit do prohlížeče (plné úložiště nebo zakázané). Platí jen do zavření stránky.'); }
}
function queueWrite(k) {
  writeChain[k] = (writeChain[k] || Promise.resolve()).then(async () => {
    if (!crypt.key) return;

/* ---------- 7c. DETAIL DNE – 24h ČASOVÁ OSA ---------- */
/** Rozložení překrývajících se činností do sloupců (jako Google Calendar).
    1) seskupí navzájem se překrývající činnosti do clusterů,
    2) v clusteru přiřadí každé činnosti první volný sloupec. */
function layoutDay(list) {
  const items = list.map(ev => {
    const s = toMin(ev.start);
    return { ev, s, e: Math.min(1440, s + Math.max(ev.duration, 20)) };
  }).sort((a, b) => a.s - b.s || b.e - a.e);
  const clusters = []; let cur = [], curEnd = -1;
  for (const it of items) {
    if (cur.length && it.s >= curEnd) { clusters.push(cur); cur = []; }
    cur.push(it); curEnd = Math.max(curEnd, it.e);
  }
  if (cur.length) clusters.push(cur);
  for (const cl of clusters) {
    const colEnds = [];
    for (const it of cl) {
      let c = colEnds.findIndex(end => end <= it.s);
      if (c === -1) { c = colEnds.length; colEnds.push(it.e); } else colEnds[c] = it.e;
      it.col = c;
    }
    cl.forEach(it => it.ncol = colEnds.length);
  }
  return items;
}

function renderDay(date) {
  const d = parseYmd(date);
  if (isNaN(d)) { go('kalendar'); return; }
  const list = (eventsByDate()[date] || []);
  const total = list.reduce((s, e) => s + e.duration, 0);
  const isToday = date === todayYmd();
  const L = 66; // šířka sloupce s hodinami (px)

  let hours = '';
  for (let h = 0; h < 24; h++) hours += `<div class="hr" style="top:${h * HOUR_H}px"><span>${pad(h)}:00</span></div>`;

  const blocks = layoutDay(list).map(it => {
    const ev = it.ev, top = it.s * HOUR_H / 60, h = Math.max(20, (Math.min(1440, it.s + ev.duration) - it.s) * HOUR_H / 60 - 3);
    const left = `calc(${L}px + (100% - ${L + 8}px) * ${it.col} / ${it.ncol})`;
    const width = `calc((100% - ${L + 8}px) / ${it.ncol} - 4px)`;
    return `<button class="blk${h < 40 ? ' short' : ''}" data-id="${ev.id}"
      style="top:${top + 1}px;height:${h}px;left:${left};width:${width};${colorVars(ev.color)}"
      aria-label="${esc(ev.title)}, ${ev.start} až ${eventEndLabel(ev)}">
      <span class="bi">${iconHTML(ev.icon)}</span>
      <span style="min-width:0"><b>${meetTag(ev)}${esc(ev.title)}</b><small>${ev.start}–${eventEndLabel(ev)}${ev.reminderMinutes != null ? ' · 🔔' : ''}</small></span>
    </button>`;
  }).join('');

  $('#view').innerHTML = `
    <div class="wrap">
      <div class="day-bar">
        <div class="day-row">
          <button class="circle" id="dPrev" aria-label="Předchozí den">‹</button>
          <div class="mid"><h2>${cap(DAYS_LONG[dowIdx(d)])} ${czDateMid(d)}</h2>
            <small>${list.length ? `${list.length} ${plural(list.length, 'činnost', 'činnosti', 'činností')} · ${fmtDur(total)}` : 'Klepněte do osy nebo na +'}</small></div>
          <button class="circle" id="dNext" aria-label="Další den">›</button>
        </div>
        ${weekStripHTML(date)}
        ${meetStripHTML(date.slice(0, 7))}
      </div>
      <div class="timeline" id="tl" style="height:${24 * HOUR_H}px">
        ${hours}${blocks}
        ${isToday ? '<div class="now" id="nowLine"></div>' : ''}
      </div>
    </div>
    <button class="fab" id="fab" aria-label="Přidat činnost">+</button>`;

  updateNowLine();
  $('#dPrev').onclick = () => go('den-' + ymd(addDays(d, -1)));
  $('#dNext').onclick = () => go('den-' + ymd(addDays(d, 1)));
  $('.day-bar .strip').onclick = e => { const b = e.target.closest('[data-date]'); if (b) go('den-' + b.dataset.date); };
  const ms = $('#meetStrip'); if (ms) ms.onclick = () => go('finance');
  $('#fab').onclick = () => openForm({ date });
  $('#tl').onclick = e => {
    const b = e.target.closest('.blk');
    if (b) { const ev = events.find(x => x.id === b.dataset.id); if (ev) openForm({ ev }); return; }
    // klik do prázdné osy → nová činnost v daném čase (zaokrouhleno na 15 min)
    const y = e.clientY - $('#tl').getBoundingClientRect().top;
    const m = Math.max(0, Math.min(1425, Math.floor(y / HOUR_H * 4) * 15));
    openForm({ date, start: minToHHMM(m) });
  };

  // posun osy: dnes na aktuální čas, jinak na 7:00 nebo první činnost
  const n = new Date();
  const focusMin = isToday ? n.getHours() * 60 + n.getMinutes() - 60
    : (list.length ? Math.min(toMin(list[0].start), 7 * 60) : 7 * 60);
  const tl = $('#tl');
  $('#view').scrollTop = Math.max(0, tl.offsetTop + focusMin * HOUR_H / 60 - $('.day-bar').offsetHeight - 10);

  // otevření editace z týdenního přehledu / karet plánu
  if (state.pendingEditId) {
    const ev = events.find(x => x.id === state.pendingEditId);
    state.pendingEditId = null;
    if (ev) openForm({ ev });
  }
}
function updateNowLine() {
  const el = $('#nowLine'); if (!el) return;
  const n = new Date();
  el.style.top = ((n.getHours() * 60 + n.getMinutes()) * HOUR_H / 60) + 'px';
}

/* ---------- 7d. TÝDENNÍ PŘEHLED ---------- */
function renderWeek() {
  const ws = state.weekStart, we = addDays(ws, 6);
  const curWs = startOfWeek(new Date());
  const diff = Math.round((ws - curWs) / 864e5 / 7);
  const label = diff === 0 ? 'Tento týden' : diff === -1 ? 'Minulý týden' : diff === 1 ? 'Příští týden' : (diff > 0 ? `Za ${diff} týdny` : `Před ${-diff} týdny`);
  const range = ws.getFullYear() === we.getFullYear()
    ? `${czDateShort(ws)} – ${czDateShort(we)} ${we.getFullYear()}`
    : `${czDateShort(ws)} ${ws.getFullYear()} – ${czDateShort(we)} ${we.getFullYear()}`;
  const map = eventsByDate();
  const today = todayYmd();
  let count = 0, total = 0, cols = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i), key = ymd(d), list = map[key] || [];
    count += list.length; total += list.reduce((s, e) => s + e.duration, 0);
    cols += `<section class="wday${key === today ? ' today' : ''}">
      <h3>${cap(DAYS_LONG[i])}<span>${czDateShort(d)}</span></h3>
      ${list.length ? list.map(ev => `
        <button class="witem" data-id="${ev.id}" style="${colorVars(ev.color)}">
          <span class="wi">${iconHTML(ev.icon)}</span>
          <span><b>${meetTag(ev)}${esc(ev.title)}</b><small>${ev.start}–${eventEndLabel(ev)}</small></span>
        </button>`).join('') : '<p class="none">Volno</p>'}
    </section>`;
  }
  $('#view').innerHTML = `
    <div class="wrap">
      <div class="week-bar">
        <button class="circle" id="wPrev" aria-label="Předchozí týden">‹</button>
        <div class="mid"><h2>${label}</h2><small>${range}</small></div>
        <button class="circle" id="wNext" aria-label="Další týden">›</button>
        <button class="btn small primary" id="wToday">Dnes</button>
      </div>
      <div class="week-sum">
        <div><b>${count}</b><span>${plural(count, 'činnost', 'činnosti', 'činností')} v týdnu</span></div>
        <div><b>${fmtDur(total)}</b><span>naplánováno celkem</span></div>
      </div>
      <div class="week-grid">${cols}</div>
    </div>`;
  $('#wPrev').onclick = () => { state.weekStart = addDays(ws, -7); renderWeek(); };
  $('#wNext').onclick = () => { state.weekStart = addDays(ws, 7); renderWeek(); };
  $('#wToday').onclick = () => { state.weekStart = startOfWeek(new Date()); renderWeek(); };
  $('.week-grid').onclick = e => {
    const b = e.target.closest('.witem'); if (!b) return;
    const ev = events.find(x => x.id === b.dataset.id); if (!ev) return;
    state.pendingEditId = ev.id;
    go('den-' + ev.date);
  };
}

  $('#pinForm').onsubmit = async e => {

      msg.className = 'msg'; msg.textContent = 'Ověřuji…';
      try { await unwrapWith(crypt.vault.pin, o); } catch (x) { return bad('Současný PIN nesouhlasí.'); }
      if (!isPinLike(n)) return bad(`Nový PIN musí mít ${PIN_LEN} číslic.`);
      if (weakPin(n)) return bad('Tenhle PIN se dá snadno uhodnout. Zvolte jiný.');
      if (n !== n2) return bad('Nové PINy se neshodují.');
      await vaultSetPin(n);
    } else {
      if ((await hashPin(o)) !== (await storedPinHash())) return bad('Současný PIN nesouhlasí.');
      if (!/^\d{4}$/.test(n)) return bad('Nový PIN musí mít 4 číslice.');
      if (n !== n2) return bad('Nové PINy se neshodují.');
      store.set(KEYS.pin, await hashPin(n));
    }
    e.target.reset(); msg.className = 'msg ok'; msg.textContent = 'PIN změněn.';
  };
  // nový záchranný kód (uloží se až po potvrzení, že je zapsaný)
  const rcf = $('#rcNewForm');
  if (rcf) rcf.onsubmit = async e => {
    e.preventDefault();
    const msg = $('#rcMsg');
    msg.className = 'msg'; msg.textContent = 'Ověřuji…';
    try { await unwrapWith(crypt.vault.pin, $('#rcPin').value); } catch (x) { msg.className = 'msg bad'; msg.textContent = 'PIN nesouhlasí.'; return; }
    rcf.reset(); msg.textContent = '';

  };

  // notifikace
  $('#setBrowserNotif').onchange = e => { settings.browserNotif = e.target.checked; saveSettings(); };
  $('#setRemindDef').oninput = e => { const n = parseInt(e.target.value, 10); if (n >= 0 && n <= 60) { settings.clientRemindDefault = n; saveSettings(); } };
  const ask = $('#askNotif');
  if (ask) ask.onclick = () => requestNotifPermission(true).then(renderSettings);
  $('#testNotif').onclick = () => {
    const n = new Date(Date.now() + 10 * 60000);
    fireReminder({ id: 'test', title: 'Zkušební upozornění', icon: '🔔', color: COLORS[0],
      date: ymd(n), start: `${pad(n.getHours())}:${pad(n.getMinutes())}`, duration: 30 });
  };

  // šablony
  $('#view').querySelectorAll('[data-del-tpl]').forEach(b => b.onclick = () => {
    templates = templates.filter(t => t.id !== b.dataset.delTpl); saveTemplates(); renderSettings();
  });

  // záloha
  const backupJSON = async () => {
    const json = JSON.stringify({ app: 'planovac', schemaVersion: SCHEMA_VERSION, events, templates, settings,
      financeSettings: finSettings, financeHistory: store.get(FIN_KEYS.history, []), goalCelebrated: store.get(FIN_KEYS.celebrated, {}),
      vypovediHistory: store.get(VYP_KEY, []), dismissedWarnings: store.get(VYP_DISMISS_KEY, []),
      clients, clientHistory: store.get(CL_KEYS.history, []), dismissedClientWarnings: store.get(CL_KEYS.dismissed, []), notifiedEvents: store.get(CL_KEYS.notified, {}),
      vzdelavaniSettings: eduSettings, tabulkaKlienta: tkAll });
    if (!vaultOn() || !crypt.key) return json;
    return JSON.stringify({ app: 'planovac', schemaVersion: SCHEMA_VERSION, encrypted: 1, created: new Date().toISOString(),
      vault: { pin: crypt.vault.pin, rescue: crypt.vault.rescue }, data: await sealWith(crypt.key, json) });
  };
  $('#expFile').onclick = async () => saveFile(`benefit-planner-zaloha-${todayYmd()}.json`, await backupJSON(), 'application/json');
  $('#expBtn').onclick = async () => {
    const json = await backupJSON();
    const msg = $('#bkMsg');
    try { await navigator.clipboard.writeText(json); msg.className = 'msg ok'; msg.textContent = 'Záloha zkopírována do schránky.'; }
    catch (e) { $('#impTxt').value = json; $('#impTxt').select(); msg.className = 'msg'; msg.textContent = 'Schránka nedostupná – text je označený v poli níže, zkopírujte ho ručně.'; }
  };
  let impArmed = false;
  $('#impBtn').onclick = async () => {
    const msg = $('#bkMsg');
    let data;
    try { data = JSON.parse($('#impTxt').value); } catch (e) { msg.className = 'msg bad'; msg.textContent = 'Text není platná záloha.'; return; }
    if (data && data.app === 'planovac' && data.encrypted) {
      const secret = $('#impPin').value.trim();
      const bad = t => { msg.className = 'msg bad'; msg.textContent = t; };
      if (!CRYPTO_OK) return bad('Tento prohlížeč tu neumí šifrovanou zálohu otevřít (stránka není přes https).');
      if (!secret) return bad('Záloha je zašifrovaná – zadejte PIN platný při jejím vytvoření, nebo záchranný kód.');
      msg.className = 'msg'; msg.textContent = 'Ověřuji…';
      try { data = JSON.parse(await openWith(await unwrapAny(data.vault, secret), data.data)); }
      catch (e) { return bad('PIN nebo záchranný kód k této záloze nesedí.'); }
      msg.textContent = '';
    }
    if (!data || data.app !== 'planovac' || !Array.isArray(data.events) || !Array.isArray(data.templates)) { msg.className = 'msg bad'; msg.textContent = 'Text není platná záloha.'; return; }
    if (!impArmed) { impArmed = true; $('#impBtn').textContent = 'Opravdu přepsat současná data?'; $('#impBtn').classList.add('danger'); return; }
    events = data.events; templates = data.templates;
    if (data.financeSettings) { finSettings = Object.assign({}, FIN_DEFAULTS, data.financeSettings); saveFin(); }
    if (Array.isArray(data.financeHistory)) store.set(FIN_KEYS.history, data.financeHistory.slice(0, FIN_HISTORY_LIMIT));
    if (data.goalCelebrated) store.set(FIN_KEYS.celebrated, data.goalCelebrated);
    if (Array.isArray(data.vypovediHistory)) store.set(VYP_KEY, data.vypovediHistory.slice(0, VYP_LIMIT));
    if (Array.isArray(data.dismissedWarnings)) store.set(VYP_DISMISS_KEY, data.dismissedWarnings);
    if (Array.isArray(data.clients)) { clients = data.clients.map(normalizeClient); saveClients(); }
    if (Array.isArray(data.clientHistory)) store.set(CL_KEYS.history, data.clientHistory.slice(0, CL_HISTORY_LIMIT));
    if (Array.isArray(data.dismissedClientWarnings)) store.set(CL_KEYS.dismissed, data.dismissedClientWarnings);
    if (data.notifiedEvents) store.set(CL_KEYS.notified, data.notifiedEvents);
    if (data.vzdelavaniSettings && Array.isArray(data.vzdelavaniSettings.zdroje)) { eduSettings = data.vzdelavaniSettings; saveEduSettings(); }
    if (data.tabulkaKlienta && typeof data.tabulkaKlienta === 'object') { tkAll = data.tabulkaKlienta; saveTk(); }
    if (data.settings) settings = Object.assign(settings, data.settings, { schemaVersion: SCHEMA_VERSION });
    saveEvents(); saveTemplates(); saveSettings(); applyTheme(); renderSettings();
    $('#bkMsg').className = 'msg ok'; $('#bkMsg').textContent = `Obnoveno: ${events.length} činností, ${templates.length} šablon.`;
  };
}

/** Nový záchranný kód: ukáže se, a platit začne až po potvrzení „Kód mám uložený“. */
function openRescueModal() {

  </div></div>`;
  $('#rcX').onclick = closeModal;
